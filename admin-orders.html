<style>
body{margin:0;background:#F4F6F5}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .15s ease;cursor:pointer}
.btn:active{transform:scale(.97)}
.bp:hover{background:#08564D !important;color:#FFFFFF !important}
.bg:hover{background:#EDF1F0 !important}
.sn{transition:background-color .2s ease,color .2s ease}.sn:hover{background:rgba(255,255,255,.07) !important;color:#FFFFFF !important}
.tr{transition:background-color .2s ease}.tr:hover{background:#F8FAF9 !important}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .4s cubic-bezier(.2,.7,.2,1.15) both}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>

      <div class="rise d3" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5A6B68">تخفیف داده‌شده</span><span style="font-size: 24px; font-weight: 800">۹٫۲ <span style="font-size: 13px; font-weight: 500; color: #5A6B68">میلیون تومان</span></span></div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
      <label style="flex: 1 1 260px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 12px; color: #5A6B68">

      </label>

        </template>
      </div>
      <label style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)" for="or">بازه</label>

    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">

            <thead><tr style="background: #F6F7F6; color: #5A6B68; text-align: right"><th style="padding: 12px 18px; font-weight: 600">سفارش</th><th style="padding: 12px; font-weight: 600">دانشجو</th><th style="padding: 12px; font-weight: 600">دوره</th><th style="padding: 12px; font-weight: 600">مبلغ (تومان)</th><th style="padding: 12px; font-weight: 600">زمان</th><th style="padding: 12px 18px; font-weight: 600">وضعیت</th></tr></thead>
            <tbody>

                  <td style="padding: 6px 12px; font-weight: 600">{{ o.name }}</td>
                  <td style="padding: 6px 12px">{{ o.course }}</td>
                  <td style="padding: 6px 12px">{{ o.paid }}</td>
                  <td style="padding: 6px 12px; color: #5A6B68">{{ o.time }}</td>
                  <td style="padding: 6px 18px"><span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{ o.stBg }}; color: {{ o.stFg }}; white-space: nowrap">{{ o.status }}</span></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <template data-sc="if" value="{{ empty }}" hint-placeholder-val="{{ false }}">

            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">

            <dl style="margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
              <div style="display: flex; justify-content: space-between; gap: 10px"><dt style="color: #5A6B68">دوره</dt><dd style="margin: 0; font-weight: 600; text-align: left">{{ o.course }}</dd></div>
              <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">قیمت</dt><dd style="margin: 0">{{ o.price }}</dd></div>
              <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">کد تخفیف</dt><dd style="margin: 0; color: #9A4515">{{ o.coupon }}</dd></div>
              <div style="display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px dashed #E3E8E6"><dt style="font-weight: 700">مبلغ پرداختی</dt><dd style="margin: 0; font-weight: 800">{{ o.paid }} تومان</dd></div>
              <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">درگاه</dt><dd style="margin: 0">[نام درگاه پرداخت]</dd></div>
              <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">کد پیگیری بانک</dt><dd style="margin: 0">{{ o.ref }}</dd></div>
            </dl>
            <ol style="list-style: none; margin: 0; padding: 14px; background: #F6F7F6; border-radius: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
              <template data-sc="for" list="{{ o.steps }}" as="st" hint-placeholder-count="3">
                <li style="display: flex; align-items: center; gap: 10px"><span style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: {{ st.dot }}"></span><span style="flex: 1">{{ st.label }}</span><span style="color: #5A6B68; font-size: 12px">{{ st.time }}</span></li>
              </template>
            </ol>
            <template data-sc="if" value="{{ o.isOk }}" hint-placeholder-val="{{ true }}">
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                <button class="btn bp" type="button" style="height: 44px; border: 0; border-radius: 12px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700">ارسال فاکتور</button>

              </div>
            </template>
            <template data-sc="if" value="{{ o.isFail }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; gap: 8px">
                <p style="font-size: 12px; line-height: 1.9; color: #9A4515; padding: 10px 12px; background: #FDF6EF; border-radius: 12px">{{ o.reason }}</p>
                <button class="btn bp" type="button" style="height: 44px; border: 0; border-radius: 12px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700">ارسال دوباره لینک پرداخت</button>
                <button class="btn bg" type="button" style="height: 44px; border: 1px solid #DCE3E0; border-radius: 12px; background: #FFFFFF; color: #10201E; font: inherit; font-size: 13px; font-weight: 600">فعال‌سازی دستی دوره (پرداخت خارج از سایت)</button>
              </div>
            </template>
            <template data-sc="if" value="{{ o.isWait }}" hint-placeholder-val="{{ false }}">
              <button class="btn bp" type="button" style="height: 44px; border: 0; border-radius: 12px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700">ارسال یادآوری پیامکی</button>
            </template>
          </div>
        </template>
      </aside>
    </div>
  </main>
</div>
</template>

      ['#۱۰۴۴۹', 'فاطمه حسینی', '۰۹۰۱ ۲۳۶ ۷۷۴۰', 'اصول حسابداری ۱ و ۲', '۱٬۴۵۰٬۰۰۰', 'ARMAN10 · −۱۴۵٬۰۰۰', '۱٬۳۰۵٬۰۰۰', 'امروز ۰۹:۱۵', 'ok', '۸۴۴۹۹۱'],
      ['#۱۰۴۴۸', 'کیان مرادی', '۰۹۱۹ ۳۳۰ ۵۶۱۲', 'حقوق و دستمزد', '۹۸۰٬۰۰۰', '—', '۹۸۰٬۰۰۰', 'دیروز ۲۲:۴۰', 'wait', '—'],
      ['#۱۰۴۴۷', 'سمیرا جعفری', '۰۹۱۶ ۲۰۸ ۹۹۰۴', 'صورت‌های مالی و گزارشگری', '۲٬۴۵۰٬۰۰۰', '—', '۲٬۴۵۰٬۰۰۰', 'دیروز ۱۸:۰۵', 'ok', '۸۴۳۸۲۰'],
      ['#۱۰۴۴۶', 'حامد رستمی', '۰۹۳۶ ۵۸۱ ۲۲۴۷', 'مالیات بر ارزش افزوده', '۱٬۸۵۰٬۰۰۰', '—', '۱٬۸۵۰٬۰۰۰', 'دیروز ۱۱:۳۰', 'fail', '—'],
      ['#۱۰۴۴۵', 'نرگس کریمی', '۰۹۱۶ ۸۸۰ ۱۲۷۵', 'حسابداری مالیاتی', '۲٬۲۰۰٬۰۰۰', 'PAYIZ20 · −۴۴۰٬۰۰۰', '۱٬۷۶۰٬۰۰۰', '۱۶ مهر', 'ok', '۸۴۲۷۱۶']
    ];
    const s = this.state;
    const all = data.map((d) => {
      const st = ST[d[8]];
      const parts = d[1].split(' ');
      const steps = d[8] === 'ok'
        ? [{ label: 'ثبت سفارش', time: d[7], dot: '#0B6E63' }, { label: 'انتقال به درگاه', time: '+۱ دقیقه', dot: '#0B6E63' }, { label: 'پرداخت موفق و فعال‌شدن دوره', time: '+۲ دقیقه', dot: '#0B6E63' }]
        : d[8] === 'fail'
          ? [{ label: 'ثبت سفارش', time: d[7], dot: '#0B6E63' }, { label: 'انتقال به درگاه', time: '+۱ دقیقه', dot: '#0B6E63' }, { label: 'پرداخت ناموفق', time: '+۴ دقیقه', dot: '#B4541A' }]
          : [{ label: 'ثبت سفارش', time: d[7], dot: '#0B6E63' }, { label: 'منتظر پرداخت دانشجو', time: '—', dot: '#CFD8D5' }];
      return {
        id: d[0], name: d[1], mobile: d[2], course: d[3], price: d[4], coupon: d[5], paid: d[6], time: d[7], ref: d[9], kind: d[8],
        status: st.label, stBg: st.bg, stFg: st.fg, ini: parts[0][0] + ' ' + parts[parts.length - 1][0], steps,
        isOk: d[8] === 'ok', isFail: d[8] === 'fail', isWait: d[8] === 'wait',
        reason: 'دانشجو در صفحه درگاه از پرداخت انصراف داده است. مبلغی از حساب کسر نشده.'
      };
    });
    const list = s.f === 'all' ? all : all.filter((o) => o.kind === s.f);
    const rows = list.map((o) => ({ ...o, bg: o.id === s.sel ? '#F1F8F6' : '#FFFFFF', pressed: o.id === s.sel ? 'true' : 'false', pick: () => this.setState({ sel: o.id }) }));
    const filters = [['all', 'همه'], ['ok', 'موفق'], ['fail', 'ناموفق'], ['wait', 'در انتظار']].map(([k, label]) => ({
      label, sel: s.f === k ? 'true' : 'false',
      bg: s.f === k ? '#FFFFFF' : 'transparent', fg: s.f === k ? '#10201E' : '#4A5B57',
      fw: s.f === k ? '700' : '500', sh: s.f === k ? '0 4px 12px -6px rgba(16,32,30,.3)' : 'none',
      pick: () => this.setState({ f: k })
    }));
    const o = all.find((x) => x.id === s.sel);
    return { rows, filters, empty: rows.length === 0, o: o || all[0], has: true };
  }
}
