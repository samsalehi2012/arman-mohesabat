<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اپ — ورود و پرداخت | آکادمی آرمان محاسبات</title>
<meta name="description" content="نسخه نمایشی سایت و اپ آموزشی آکادمی آرمان محاسبات قشم">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آرمان محاسبات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
body{margin:0}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,transform .15s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96)}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.scroll>*{flex-shrink:0}
.inp{transition:border-color .2s ease,box-shadow .2s ease}.inp:focus{border-color:#0B6E63 !important;box-shadow:0 0 0 4px rgba(11,110,99,.12);outline:0}
.fade{animation:fade .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{border-color:#DCE3E0}}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>
<body class="phone-page">
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="am" dir="rtl" style="width: 390px; height: 844px; background: #F6F7F6; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex: none; padding: 16px; display: flex; align-items: center; gap: 12px">
    <a class="btn" href="app-course.html" aria-label="بازگشت" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E3E8E6; background: #FFFFFF; color: #10201E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    <h1 style="font-size: 17px; font-weight: 800">تکمیل خرید</h1>
    <span style="margin-right: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #33433F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>پرداخت امن</span>
  </header>

  <ol aria-label="مراحل خرید" style="flex: none; list-style: none; margin: 0; padding: 0 16px 12px; display: flex; gap: 6px">
    <li style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 99px; background: #0B6E63"></span><span style="font-size: 11px; font-weight: 700; color: #0B6E63">ورود</span></li>
    <li style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 99px; background: {{ step2 }}"></span><span style="font-size: 11px; color: #4A5B57">اطلاعات</span></li>
    <li style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 99px; background: {{ step2 }}"></span><span style="font-size: 11px; color: #4A5B57">پرداخت</span></li>
  </ol>

  <main class="scroll" style="flex: 1; overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 12px; display: flex; gap: 12px; align-items: center">
      <span style="flex: none; width: 52px; height: 52px; border-radius: 12px; background-color: #E7ECF2; background-image: linear-gradient(rgba(44,74,107,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(44,74,107,.1) 1px, transparent 1px); background-size: 10px 10px"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700; line-height: 1.6">مالیات بر ارزش افزوده و سامانه مؤدیان</span><span style="font-size: 12px; color: #5A6B68">۲۴ درس · دسترسی دائمی</span></span>
    </div>

    <template data-sc="if" value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
      <section class="fade" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="font-size: 18px; font-weight: 800">ورود با شماره موبایل</h2>
          <p style="font-size: 13px; line-height: 1.9; color: #4A5B57">کد تأیید به این شماره پیامک می‌شود.</p>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">شماره موبایل<input class="inp" type="tel" inputmode="numeric" value="۰۹۱۷ ۱۲۳ ۴۵۶۷" dir="ltr" style="height: 54px; border: 1px solid #DCE3E0; border-radius: 14px; padding: 0 14px; font: inherit; font-size: 18px; font-weight: 700; color: #10201E; background: #FFFFFF; text-align: right"></label>
      </section>
    </template>

    <template data-sc="if" value="{{ isOtp }}" hint-placeholder-val="{{ true }}">
      <section class="fade" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="font-size: 18px; font-weight: 800">کد تأیید را وارد کنید</h2>
          <p style="font-size: 13px; line-height: 1.9; color: #4A5B57">کد ۵ رقمی به <span dir="ltr" style="font-weight: 700; color: #10201E">۰۹۱۷ ۱۲۳ ۴۵۶۷</span> پیامک شد. <button class="btn" type="button" onClick="{{ editPhone }}" style="padding: 0; border: 0; background: transparent; font: inherit; font-weight: 600; color: #0B6E63; min-height: 32px">ویرایش شماره</button></p>
        </div>
        <div dir="ltr" role="group" aria-label="کد تأیید" style="display: flex; gap: 8px; justify-content: center">
          <input class="inp" aria-label="رقم اول" inputmode="numeric" maxlength="1" value="۴" style="width: 54px; height: 60px; text-align: center; font: inherit; font-size: 24px; font-weight: 800; border: 1px solid #DCE3E0; border-radius: 14px; background: #FFFFFF; color: #10201E">
          <input class="inp" aria-label="رقم دوم" inputmode="numeric" maxlength="1" value="۸" style="width: 54px; height: 60px; text-align: center; font: inherit; font-size: 24px; font-weight: 800; border: 1px solid #DCE3E0; border-radius: 14px; background: #FFFFFF; color: #10201E">
          <input class="inp" aria-label="رقم سوم" inputmode="numeric" maxlength="1" value="۲" style="width: 54px; height: 60px; text-align: center; font: inherit; font-size: 24px; font-weight: 800; border: 1px solid #DCE3E0; border-radius: 14px; background: #FFFFFF; color: #10201E">
          <input class="inp caret" aria-label="رقم چهارم" inputmode="numeric" maxlength="1" value="" style="width: 54px; height: 60px; text-align: center; font: inherit; font-size: 24px; font-weight: 800; border: 2px solid #0B6E63; border-radius: 14px; background: #FFFFFF; color: #10201E">
          <input class="inp" aria-label="رقم پنجم" inputmode="numeric" maxlength="1" value="" style="width: 54px; height: 60px; text-align: center; font: inherit; font-size: 24px; font-weight: 800; border: 1px solid #DCE3E0; border-radius: 14px; background: #FFFFFF; color: #10201E">
        </div>
        <span style="text-align: center; font-size: 12px; color: #5A6B68">ارسال دوباره کد تا ۰۱:۴۵</span>
        <p style="font-size: 12px; line-height: 1.9; color: #5A6B68; padding: 10px 12px; background: #F6F7F6; border-radius: 12px">اگر حساب ندارید، با همین شماره برایتان ساخته می‌شود.</p>
      </section>
    </template>

    <template data-sc="if" value="{{ isPay }}" hint-placeholder-val="{{ false }}">
      <div class="fade" style="display: flex; flex-direction: column; gap: 14px">
        <section style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
          <h2 style="font-size: 15px; font-weight: 800">اطلاعات دانشجو</h2>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">نام<input class="inp" type="text" value="سارا" style="height: 48px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 15px; color: #10201E; background: #FFFFFF"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">نام خانوادگی<input class="inp" type="text" value="محمدی" style="height: 48px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 15px; color: #10201E; background: #FFFFFF"></label>
          <span style="font-size: 12px; color: #5A6B68">نام شما روی گواهی پایان دوره درج می‌شود.</span>
        </section>
        <section style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
          <label for="mc" style="font-size: 13px; font-weight: 600">کد تخفیف</label>
          <div style="display: flex; gap: 8px"><input id="mc" class="inp" type="text" value="ARMAN10" dir="ltr" style="flex: 1; min-width: 0; height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 14px; text-align: right; color: #10201E; background: #FFFFFF"><button class="btn" type="button" onClick="{{ toggleCoupon }}" style="height: 46px; padding: 0 16px; border: 1px solid #10201E; background: #FFFFFF; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700; color: #10201E">{{ couponBtn }}</button></div>
          <dl style="margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px; padding-top: 12px; border-top: 1px solid #E3E8E6">
            <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">قیمت دوره</dt><dd style="margin: 0">۲٬۲۰۰٬۰۰۰</dd></div>
            <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">تخفیف</dt><dd style="margin: 0; color: #9A4515">{{ discount }}</dd></div>
          </dl>
        </section>
        <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 2px solid #0B6E63; background: #F3F9F7; border-radius: 16px">
          <input type="radio" name="mp" checked style="width: 20px; height: 20px; accent-color: #0B6E63; margin: 0">
          <span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 14px">پرداخت آنلاین</span><span style="font-size: 12px; color: #5A6B68">کارت‌های عضو شتاب · [نام درگاه]</span></span>
        </label>
      </div>
    </template>
  </main>

  <div style="flex: none; background: #FFFFFF; border-top: 1px solid #E3E8E6; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px">
    <template data-sc="if" value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
      <button class="btn" type="button" onClick="{{ sendCode }}" style="width: 100%; height: 54px; border: 0; border-radius: 14px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">ارسال کد تأیید</button>
    </template>
    <template data-sc="if" value="{{ isOtp }}" hint-placeholder-val="{{ true }}">
      <button class="btn" type="button" onClick="{{ confirm }}" style="width: 100%; height: 54px; border: 0; border-radius: 14px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">تأیید و ادامه</button>
    </template>
    <template data-sc="if" value="{{ isPay }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px"><span style="color: #5A6B68">مبلغ قابل پرداخت</span><span><span style="font-size: 20px; font-weight: 800">{{ total }}</span> <span style="color: #5A6B68">تومان</span></span></div>
      <a class="btn" href="app-learning.html" style="width: 100%; height: 54px; border-radius: 14px; background: #0B6E63; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">پرداخت و شروع دوره</a>
    </template>
  </div>
</div>
</template>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'otp', coupon: false };
  }
  renderVals() {
    const s = this.state;
    return {
      isPhone: s.step === 'phone',
      editPhone: () => this.setState({ step: 'phone' }),
      sendCode: () => this.setState({ step: 'otp' }),
      isOtp: s.step === 'otp',
      isPay: s.step === 'pay',
      step2: s.step === 'pay' ? '#0B6E63' : '#DCE3E0',
      confirm: () => this.setState({ step: 'pay' }),
      toggleCoupon: () => this.setState({ coupon: !this.state.coupon }),
      couponBtn: s.coupon ? 'حذف' : 'اعمال',
      discount: s.coupon ? '−۵۳۵٬۰۰۰' : '−۳۵۰٬۰۰۰',
      total: s.coupon ? '۱٬۶۶۵٬۰۰۰' : '۱٬۸۵۰٬۰۰۰'
    };
  }
}
</script>
<script src="assets/dc-lite.js" defer></script>
<noscript><p style="font-family:Tahoma,sans-serif;padding:24px;direction:rtl">برای دیدن این نسخه نمایشی، جاوااسکریپت مرورگر را روشن کنید.</p></noscript>
</body>
</html>
