<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اپ مدیریت — دانشجویان | آکادمی آرمان محاسبات</title>
<meta name="description" content="نسخه نمایشی سایت و اپ آموزشی آکادمی آرمان محاسبات قشم">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آرمان محاسبات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
body{margin:0}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,transform .15s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.scroll>*{flex-shrink:0}
.sheet{animation:sheet .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.dim{animation:dim .3s ease both}
@keyframes dim{from{opacity:0}to{opacity:1}}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>
<body class="phone-page">
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="am" dir="rtl" style="position: relative; width: 390px; height: 844px; background: #F4F6F5; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex: none; padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column"><h1 style="font-size: 22px; font-weight: 800">دانشجویان</h1><span style="font-size: 12px; color: #5A6B68">۱٬۲۴۶ دانشجو</span></div>
      <button class="btn" type="button" aria-label="افزودن دانشجو" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #0B6E63; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 14px; color: #5A6B68">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" placeholder="نام یا شماره موبایل" aria-label="جستجوی دانشجو" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: #10201E">
    </label>
    <div class="scroll" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
      <span style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: #10201E; color: #FFFFFF; font-size: 12px; display: flex; align-items: center">همه</span>
      <span style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E0; font-size: 12px; display: flex; align-items: center">فعال</span>
      <span style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E0; font-size: 12px; display: flex; align-items: center">بدون خرید</span>
      <span style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E0; font-size: 12px; display: flex; align-items: center">مسدود</span>
      <span style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E0; font-size: 12px; display: flex; align-items: center">خروجی اکسل</span>
    </div>
  </header>

  <main class="scroll" style="flex: 1; overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 8px">
    <template data-sc="for" list="{{ rows }}" as="r" hint-placeholder-count="7">
      <button class="btn" type="button" onClick="{{ r.pick }}" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; font: inherit; color: #10201E; text-align: right">
        <span style="flex: none; width: 42px; height: 42px; border-radius: 12px; background: {{ r.tint }}; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center">{{ r.ini }}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14px; font-weight: 700">{{ r.name }}</span><span style="font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 700; background: {{ r.stBg }}; color: {{ r.stFg }}">{{ r.status }}</span></span>
          <span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; height: 5px; background: #EDF1F0; border-radius: 99px; overflow: hidden"><span style="display: block; height: 100%; width: {{ r.pctCss }}; background: #0B6E63; border-radius: 99px"></span></span><span style="font-size: 11px; color: #5A6B68; white-space: nowrap">{{ r.count }} · {{ r.pctLabel }}</span></span>
        </span>
      </button>
    </template>
  </main>

  <nav aria-label="منوی مدیریت" style="flex: none; background: #FFFFFF; border-top: 1px solid #E3E8E6; padding: 8px 8px 18px; display: flex; justify-content: space-around">
    <a href="app-admin.html" style="min-width: 70px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5A6B68; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>پیشخوان</a>
    <a href="app-admin-students.html" aria-current="page" style="min-width: 70px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #0B6E63; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg>دانشجویان</a>
    <a href="app-admin-courses.html" style="min-width: 70px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5A6B68; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5.5v13L18 12z"></path></svg>دوره‌ها</a>
    <a href="app-admin-more.html" style="min-width: 70px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5A6B68; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>بیشتر</a>
  </nav>

  <template data-sc="if" value="{{ open }}" hint-placeholder-val="{{ true }}">
    <div class="dim" aria-hidden="true" style="position: absolute; inset: 0; background: rgba(16,32,30,.42)"></div>
    <section class="sheet" role="dialog" aria-label="جزئیات دانشجو" style="position: absolute; right: 0; left: 0; bottom: 0; max-height: 640px; background: #FFFFFF; border-radius: 26px 26px 0 0; padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -20px 50px -20px rgba(0,0,0,.35)">
      <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 99px; background: #DCE3E0"></span>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: {{ s.tint }}; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center">{{ s.ini }}</span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">{{ s.name }}</span><span dir="ltr" style="font-size: 12px; color: #5A6B68; text-align: right">{{ s.mobile }}</span></span>
        <button class="btn" type="button" onClick="{{ close }}" aria-label="بستن" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E3E8E6; background: #FFFFFF; color: #10201E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <dl style="margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 12px">
        <div style="padding: 10px; background: #F6F7F6; border-radius: 12px"><dt style="color: #5A6B68; font-size: 11px">عضویت</dt><dd style="margin: 2px 0 0; font-weight: 700">{{ s.joined }}</dd></div>
        <div style="padding: 10px; background: #F6F7F6; border-radius: 12px"><dt style="color: #5A6B68; font-size: 11px">پرداخت (تومان)</dt><dd style="margin: 2px 0 0; font-weight: 700">{{ s.paid }}</dd></div>
        <div style="padding: 10px; background: #F6F7F6; border-radius: 12px"><dt style="color: #5A6B68; font-size: 11px">وضعیت</dt><dd style="margin: 2px 0 0; font-weight: 700; color: {{ s.stFg }}">{{ s.status }}</dd></div>
      </dl>
      <div class="scroll" style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto">
        <template data-sc="if" value="{{ s.none }}" hint-placeholder-val="{{ false }}"><p style="font-size: 13px; color: #5A6B68; padding: 12px; border: 1px dashed #D5DDDA; border-radius: 12px">هنوز دوره‌ای خریداری نشده است.</p></template>
        <template data-sc="for" list="{{ s.courses }}" as="c" hint-placeholder-count="3">
          <div style="padding: 10px 12px; border: 1px solid #E3E8E6; border-radius: 14px; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 700">{{ c.title }}</span><span style="font-weight: 800; color: {{ c.color }}">{{ c.pctLabel }}</span></div>
            <span style="display: block; height: 5px; background: #EDF1F0; border-radius: 99px; overflow: hidden"><span style="display: block; height: 100%; width: {{ c.pctCss }}; background: {{ c.color }}; border-radius: 99px"></span></span>
            <span style="font-size: 11px; color: #5A6B68">{{ c.sub }}</span>
          </div>
        </template>
      </div>
      <button class="btn" type="button" style="height: 50px; border: 0; border-radius: 14px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">افزودن دسترسی دوره</button>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button class="btn" type="button" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; background: #FFFFFF; color: #10201E; font: inherit; font-size: 13px; font-weight: 600">ارسال پیامک</button>
        <button class="btn" type="button" style="height: 46px; border: 1px solid #EAD3C2; border-radius: 12px; background: #FFFFFF; color: #9A4515; font: inherit; font-size: 13px; font-weight: 600">مسدود کردن</button>
      </div>
    </section>
  </template>
</div>
</template>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, open: true };
  }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const tints = ['#E3F1EE', '#E7ECF2', '#F4ECE2', '#EAF0E4'];
    const st = { active: ['فعال', '#E3F1EE', '#0B6E63'], none: ['بدون خرید', '#F1F3F2', '#4A5B57'], blocked: ['مسدود', '#FBEFE4', '#9A4515'] };
    const people = [
      ['سارا محمدی', '۰۹۱۷ ۱۲۳ ۴۵۶۷', 'active', '۱۰ مرداد', '۴٫۵ میلیون', [['مالیات بر ارزش افزوده', 62, 'آخرین درس: ۱۶ · امروز'], ['اصول حسابداری ۱ و ۲', 28, 'آخرین درس: ۱۲ · ۳ روز پیش'], ['اکسل برای حسابداران', 100, 'تکمیل‌شده · گواهی صادر شد']]],
      ['مهدی احمدی', '۰۹۱۲ ۴۴۸ ۲۰۱۳', 'active', '۱۸ مهر', '۱٫۸۵ میلیون', [['مالیات بر ارزش افزوده', 4, 'آخرین درس: ۱ · امروز']]],
      ['زهرا نوری', '۰۹۳۵ ۷۱۰ ۸۸۴۲', 'active', '۲ تیر', '۳٫۴ میلیون', [['حسابداری مالیاتی', 74, 'آخرین درس: ۲۲ · دیروز'], ['اکسل برای حسابداران', 89, 'آخرین درس: ۳۲ · دیروز']]],
      ['رضا کاظمی', '۰۹۱۷ ۵۵۲ ۳۰۹۱', 'none', '۱۸ مهر', '۰', []],
      ['فاطمه حسینی', '۰۹۰۱ ۲۳۶ ۷۷۴۰', 'active', '۲۵ شهریور', '۲٫۴ میلیون', [['اصول حسابداری ۱ و ۲', 52, 'آخرین درس: ۲۲ · امروز'], ['حقوق و دستمزد', 18, 'آخرین درس: ۴ · هفته پیش']]],
      ['علی رضایی', '۰۹۳۹ ۱۰۴ ۶۵۲۸', 'active', '۵ شهریور', '۱٫۸۵ میلیون', [['مالیات بر ارزش افزوده', 58, 'آخرین درس: ۱۴ · ۲ روز پیش']]],
      ['امیر صادقی', '۰۹۱۳ ۶۰۲ ۴۴۱۹', 'blocked', '۸ اردیبهشت', '۱٫۲ میلیون', [['اکسل برای حسابداران', 12, 'آخرین درس: ۴ · ۴۰ روز پیش']]]
    ];
    const rows = people.map((p, i) => {
      const avg = p[5].length ? Math.round(p[5].reduce((a, c) => a + c[1], 0) / p[5].length) : 0;
      const parts = p[0].split(' ');
      return {
        name: p[0], mobile: p[1], joined: p[3], paid: p[4],
        status: st[p[2]][0], stBg: st[p[2]][1], stFg: st[p[2]][2],
        ini: parts[0][0] + ' ' + parts[parts.length - 1][0], tint: tints[i % tints.length],
        count: p[5].length ? fa(p[5].length) + ' دوره' : 'بدون دوره',
        pctLabel: fa(avg) + '٪', pctCss: avg + '%', none: p[5].length === 0,
        courses: p[5].map((c) => ({ title: c[0], pctLabel: fa(c[1]) + '٪', pctCss: c[1] + '%', sub: c[2], color: c[1] === 100 ? '#B4541A' : '#0B6E63' })),
        pick: () => this.setState({ sel: i, open: true })
      };
    });
    return { rows, s: rows[this.state.sel], open: this.state.open, close: () => this.setState({ open: false }) };
  }
}
</script>
<script src="assets/dc-lite.js" defer></script>
<noscript><p style="font-family:Tahoma,sans-serif;padding:24px;direction:rtl">برای دیدن این نسخه نمایشی، جاوااسکریپت مرورگر را روشن کنید.</p></noscript>
</body>
</html>
