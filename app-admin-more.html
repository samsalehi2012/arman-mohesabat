<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اپ مدیریت — بیشتر | آکادمی آرمان محاسبات</title>
<meta name="description" content="نسخه نمایشی سایت و اپ آموزشی آکادمی آرمان محاسبات قشم">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آرمان محاسبات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
body{margin:0}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,transform .15s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.row:hover{background:#F6F7F6 !important}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.scroll>*{flex-shrink:0}
.knob{transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.inp{transition:border-color .2s ease,box-shadow .2s ease}.inp:focus{border-color:#0B6E63 !important;box-shadow:0 0 0 4px rgba(11,110,99,.12);outline:0}
.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.push{animation:push .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes push{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.pop{animation:pop .4s cubic-bezier(.2,.7,.2,1.15) both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>
<body class="phone-page">
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="am" dir="rtl" style="width: 390px; height: 844px; background: #F4F6F5; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex: none; padding: 18px 16px 10px; display: flex; align-items: center; gap: 12px; min-height: 70px">
    <template data-sc="if" value="{{ sub }}" hint-placeholder-val="{{ false }}">
      <button class="btn" type="button" onClick="{{ back }}" aria-label="بازگشت" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #E3E8E6; background: #FFFFFF; color: #10201E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    </template>
    <h1 style="font-size: 21px; font-weight: 800">{{ title }}</h1>
  </header>

  <main class="scroll" style="flex: 1; overflow-y: auto; padding: 4px 16px 20px">

    <!-- MENU -->
    <template data-sc="if" value="{{ v.menu }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <nav aria-label="بخش‌های مدیریت" class="rise" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
          <button class="btn row" type="button" onClick="{{ go.orders }}" style="min-height: 64px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid #EEF1F0; background: #FFFFFF; font: inherit; color: #10201E; text-align: right"><span style="width: 40px; height: 40px; border-radius: 12px; background: #E3F1EE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">سفارش‌ها و پرداخت‌ها</span><span style="font-size: 11px; color: #9A4515">۲ پرداخت ناموفق</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <button class="btn row" type="button" onClick="{{ go.coupons }}" style="min-height: 64px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid #EEF1F0; background: #FFFFFF; font: inherit; color: #10201E; text-align: right"><span style="width: 40px; height: 40px; border-radius: 12px; background: #F4ECE2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A4B17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="7.5" r="1.2"></circle></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">کدهای تخفیف</span><span style="font-size: 11px; color: #5A6B68">{{ couponMeta }}</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <button class="btn row" type="button" onClick="{{ go.qa }}" style="min-height: 64px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid #EEF1F0; background: #FFFFFF; font: inherit; color: #10201E; text-align: right"><span style="width: 40px; height: 40px; border-radius: 12px; background: #E7ECF2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C4A6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">پرسش و پاسخ</span><span style="font-size: 11px; color: #5A6B68">پرسش‌های دانشجوها زیر درس‌ها</span></span><span style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: #B4541A; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ qaOpen }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <button class="btn row" type="button" onClick="{{ go.certs }}" style="min-height: 64px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid #EEF1F0; background: #FFFFFF; font: inherit; color: #10201E; text-align: right"><span style="width: 40px; height: 40px; border-radius: 12px; background: #FBEFE4; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4541A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">گواهی‌ها</span><span style="font-size: 11px; color: #5A6B68">۲۴ صدور در این ماه</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <button class="btn row" type="button" onClick="{{ go.settings }}" style="min-height: 64px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border: 0; background: #FFFFFF; font: inherit; color: #10201E; text-align: right"><span style="width: 40px; height: 40px; border-radius: 12px; background: #EAF0E4; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F6B2E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">تنظیمات سایت</span><span style="font-size: 11px; color: #5A6B68">آپارات، درگاه، پیامک، مدیران</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        </nav>
        <div class="rise d1" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
          <a class="row" href="index.html" style="min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EEF1F0; font-size: 14px; color: #10201E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#33433F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg><span style="flex: 1">مشاهده سایت</span></a>
          <a class="row" href="index.html" style="min-height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-size: 14px; color: #9A4515"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg><span style="flex: 1">خروج از پنل</span></a>
        </div>
      </div>
    </template>

    <!-- ORDERS -->
    <template data-sc="if" value="{{ v.orders }}" hint-placeholder-val="{{ false }}">
      <div class="push" style="display: flex; flex-direction: column; gap: 10px">
        <div class="scroll" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px">
          <template data-sc="for" list="{{ ofilters }}" as="f" hint-placeholder-count="4">
            <button class="btn" type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.sel }}" style="flex: none; height: 38px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 600; border: 1px solid {{ f.bd }}; background: {{ f.bg }}; color: {{ f.fg }}">{{ f.label }}</button>
          </template>
        </div>
        <template data-sc="for" list="{{ orders }}" as="o" hint-placeholder-count="5">
          <div style="background: #FFFFFF; border: 1px solid {{ o.bd }}; border-radius: 16px; overflow: hidden">
            <button class="btn" type="button" onClick="{{ o.pick }}" aria-expanded="{{ o.expanded }}" style="width: 100%; padding: 12px 14px; border: 0; background: #FFFFFF; font: inherit; color: #10201E; text-align: right; display: flex; flex-direction: column; gap: 6px">
              <span style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px"><span style="font-weight: 800; color: #0B6E63">{{ o.id }}</span><span style="padding: 1px 8px; border-radius: 999px; font-weight: 700; background: {{ o.stBg }}; color: {{ o.stFg }}">{{ o.status }}</span></span>
              <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14px; font-weight: 700">{{ o.name }}</span><span style="font-size: 13px; font-weight: 800">{{ o.paid }}</span></span>
              <span style="font-size: 11px; color: #5A6B68">{{ o.course }} · {{ o.time }}</span>
            </button>
            <template data-sc="if" value="{{ o.open }}" hint-placeholder-val="{{ false }}">
              <div class="pop" style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px">
                <dl style="margin: 0; padding: 10px 12px; background: #F6F7F6; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12px">
                  <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">کد تخفیف</dt><dd style="margin: 0">{{ o.coupon }}</dd></div>
                  <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">کد پیگیری بانک</dt><dd style="margin: 0">{{ o.ref }}</dd></div>
                  <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">موبایل</dt><dd dir="ltr" style="margin: 0">{{ o.mobile }}</dd></div>
                </dl>
                <template data-sc="if" value="{{ o.isOk }}" hint-placeholder-val="{{ true }}"><button class="btn" type="button" style="height: 44px; border: 1px solid #DCE3E0; border-radius: 12px; background: #FFFFFF; color: #10201E; font: inherit; font-size: 13px; font-weight: 600">ارسال فاکتور به دانشجو</button></template>
                <template data-sc="if" value="{{ o.isFail }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 8px"><button class="btn" type="button" style="height: 44px; border: 0; border-radius: 12px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700">ارسال دوباره لینک پرداخت</button><button class="btn" type="button" style="height: 44px; border: 1px solid #DCE3E0; border-radius: 12px; background: #FFFFFF; color: #10201E; font: inherit; font-size: 13px; font-weight: 600">فعال‌سازی دستی دوره</button></div></template>
                <template data-sc="if" value="{{ o.isWait }}" hint-placeholder-val="{{ false }}"><button class="btn" type="button" style="height: 44px; border: 0; border-radius: 12px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700">ارسال یادآوری پیامکی</button></template>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- COUPONS -->
    <template data-sc="if" value="{{ v.coupons }}" hint-placeholder-val="{{ false }}">
      <div class="push" style="display: flex; flex-direction: column; gap: 10px">
        <template data-sc="if" value="{{ formClosed }}" hint-placeholder-val="{{ true }}">
          <button class="btn" type="button" onClick="{{ openForm }}" style="height: 50px; border: 1.5px dashed #0B6E63; border-radius: 14px; background: transparent; color: #0B6E63; font: inherit; font-size: 14px; font-weight: 700">+ کد تخفیف جدید</button>
        </template>
        <template data-sc="if" value="{{ formOpen }}" hint-placeholder-val="{{ false }}">
          <section class="pop" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">کد<input class="inp" type="text" value="{{ code }}" onChange="{{ setCode }}" dir="ltr" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 15px; font-weight: 700; color: #10201E; background: #FFFFFF"></label>
            <div style="display: flex; padding: 4px; background: #EBEFEE; border-radius: 12px">
              <button class="btn" type="button" onClick="{{ setPct }}" aria-pressed="{{ pctOn }}" style="flex: 1; height: 38px; border: 0; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 700; background: {{ pctBg }}; color: {{ pctFg }}">درصدی</button>
              <button class="btn" type="button" onClick="{{ setFix }}" aria-pressed="{{ fixOn }}" style="flex: 1; height: 38px; border: 0; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 700; background: {{ fixBg }}; color: {{ fixFg }}">مبلغ ثابت</button>
            </div>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">{{ valueLabel }}<input class="inp" type="text" value="{{ amount }}" onChange="{{ setAmount }}" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 15px; color: #10201E; background: #FFFFFF"></label>
            <div style="display: flex; gap: 8px"><button class="btn" type="button" onClick="{{ create }}" style="flex: 1; height: 46px; border: 0; border-radius: 12px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">ساخت کد</button><button class="btn" type="button" onClick="{{ closeForm }}" style="height: 46px; padding: 0 16px; border: 1px solid #DCE3E0; border-radius: 12px; background: #FFFFFF; color: #10201E; font: inherit; font-size: 13px; font-weight: 600">انصراف</button></div>
          </section>
        </template>
        <template data-sc="for" list="{{ coupons }}" as="c" hint-placeholder-count="5">
          <div style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
              <span dir="ltr" style="padding: 3px 10px; border: 1px dashed {{ c.codeBd }}; border-radius: 8px; font-weight: 800; font-size: 13px; color: {{ c.codeFg }}">{{ c.code }}</span>
              <button class="btn" type="button" role="switch" aria-checked="{{ c.on }}" aria-label="{{ c.switchLabel }}" onClick="{{ c.toggle }}" style="width: 48px; height: 32px; padding: 0; border: 0; background: transparent; display: flex; align-items: center"><span style="position: relative; width: 44px; height: 24px; border-radius: 99px; background: {{ c.trk }}; display: block"><span class="knob" style="position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.25); transform: {{ c.knob }}"></span></span></button>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="font-weight: 700">{{ c.value }} · {{ c.course }}</span><span style="color: #5A6B68">{{ c.exp }}</span></div>
            <div style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; height: 5px; background: #EDF1F0; border-radius: 99px; overflow: hidden"><span style="display: block; height: 100%; width: {{ c.usePct }}; background: {{ c.useColor }}; border-radius: 99px"></span></span><span style="font-size: 11px; color: #5A6B68">{{ c.usage }}</span></div>
          </div>
        </template>
      </div>
    </template>

    <!-- QA -->
    <template data-sc="if" value="{{ v.qaList }}" hint-placeholder-val="{{ false }}">
      <div class="push" style="display: flex; flex-direction: column; gap: 10px">
        <div role="tablist" aria-label="فیلتر" style="display: flex; padding: 4px; background: #E7ECEA; border-radius: 12px">
          <template data-sc="for" list="{{ qtabs }}" as="t" hint-placeholder-count="2">
            <button class="btn" type="button" role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="flex: 1; height: 38px; border: 0; border-radius: 9px; font: inherit; font-size: 13px; font-weight: {{ t.fw }}; background: {{ t.bg }}; color: {{ t.fg }}; box-shadow: {{ t.sh }}">{{ t.label }}</button>
          </template>
        </div>
        <template data-sc="for" list="{{ questions }}" as="q" hint-placeholder-count="5">
          <button class="btn" type="button" onClick="{{ q.pick }}" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 16px; padding: 12px 14px; font: inherit; color: #10201E; text-align: right; display: flex; flex-direction: column; gap: 6px">
            <span style="display: flex; justify-content: space-between; font-size: 11px"><b>{{ q.name }}</b><span style="color: #5A6B68">{{ q.time }}</span></span>
            <span style="font-size: 13px; line-height: 1.8">{{ q.text }}</span>
            <span style="display: flex; justify-content: space-between; font-size: 11px"><span style="color: #5A6B68">{{ q.where }}</span><span style="font-weight: 700; color: {{ q.stFg }}">{{ q.status }}</span></span>
          </button>
        </template>
        <template data-sc="if" value="{{ qEmpty }}" hint-placeholder-val="{{ false }}"><p style="padding: 24px; text-align: center; font-size: 13px; color: #5A6B68">پرسش بی‌پاسخی نمانده است.</p></template>
      </div>
    </template>
    <template data-sc="if" value="{{ v.qaThread }}" hint-placeholder-val="{{ false }}">
      <div class="push" style="display: flex; flex-direction: column; gap: 12px">
        <div style="font-size: 12px; color: #5A6B68">{{ cq.where }} · {{ cq.lesson }}</div>
        <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px"><b>{{ cq.name }}</b> <span style="color: #5A6B68">· {{ cq.time }}</span></span><p style="font-size: 14px; line-height: 2; padding: 12px; background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 4px 14px 14px 14px">{{ cq.text }}</p></div>
        <template data-sc="if" value="{{ cq.done }}" hint-placeholder-val="{{ false }}">
          <div class="pop" style="display: flex; flex-direction: column; gap: 4px; margin-right: 24px"><span style="font-size: 12px"><b>مدرس دوره</b> <span style="padding: 1px 6px; background: #0B6E63; color: #FFFFFF; border-radius: 999px; font-size: 10px">پاسخ مدرس</span></span><p style="font-size: 14px; line-height: 2; padding: 12px; background: #F3F9F7; border-radius: 4px 14px 14px 14px">{{ cq.answer }}</p></div>
        </template>
        <template data-sc="if" value="{{ cq.open }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <div class="scroll" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">

    const qall = qd.map((q) => {
      const done = !!s.answers[q[0]];
      return { id: q[0], name: q[1], where: q[2], lesson: q[3], time: q[4], text: q[5], done, open: !done, answer: s.answers[q[0]] || '', status: done ? 'پاسخ داده شد' : 'بی‌پاسخ', stFg: done ? '#0B6E63' : '#9A4515' };
    });
    const openN = qall.filter((q) => q.open).length;
    const questions = qall.filter((q) => (s.qtab === 'open' ? q.open : q.done)).map((q) => ({ ...q, pick: () => this.setState({ qsel: q.id, reply: '' }) }));
    const qtabs = [['open', 'بی‌پاسخ (' + fa(openN) + ')'], ['done', 'پاسخ‌داده']].map(([k, label]) => ({ label, ...seg(s.qtab, k), pick: () => this.setState({ qtab: k }) }));
    const cq = qall.find((q) => q.id === s.qsel) || qall[0];
    const quick = ['فایل به پیوست درس اضافه شد', 'در درس بعدی کامل توضیح داده شده', 'مثال حل‌شده را در پیوست گذاشتیم'].map((t) => ({ label: t, use: () => this.setState({ reply: t + '.' }) }));

    // certs
    const cd = [
      ['AMQ-1405-0128', 'سارا محمدی', 'اکسل برای حسابداران', '۲ مهر ۱۴۰۵'],
      ['AMQ-1405-0127', 'نرگس کریمی', 'حسابداری مالیاتی', '۲۸ شهریور ۱۴۰۵'],
      ['AMQ-1405-0126', 'زهرا نوری', 'اصول حسابداری ۱ و ۲', '۲۰ شهریور ۱۴۰۵'],
      ['AMQ-1405-0125', 'علی رضایی', 'حقوق و دستمزد', '۱۱ شهریور ۱۴۰۵'],
      ['AMQ-1405-0123', 'امیر صادقی', 'اکسل برای حسابداران', '۱۵ مرداد ۱۴۰۵']
    ];
    const call = cd.map((d) => ({ code: d[0], name: d[1], course: d[2], date: d[3], bad: !!s.revoked[d[0]] }));
    const certs = call.map((c) => ({ ...c, act: c.bad ? 'بازگردانی' : 'ابطال', actFg: c.bad ? '#0B6E63' : '#9A4515', toggle: () => this.setState({ revoked: { ...this.state.revoked, [c.code]: !this.state.revoked[c.code] } }) }));
    const hit = call.find((c) => c.code === String(s.checked || '').trim().toUpperCase());

    // settings
    const skeys = [['general', 'عمومی'], ['video', 'ویدیو و آپارات'], ['pay', 'درگاه پرداخت'], ['sms', 'پیامک'], ['team', 'مدیران']];
    const sv = {};
    skeys.forEach(([k]) => { sv[k] = s.stab === k; });
    const stabs = skeys.map(([k, label]) => ({ label, ...chip(s.stab, k), pick: () => this.setState({ stab: k, saved: false }) }));

    const titles = { menu: 'بیشتر', orders: 'سفارش‌ها و پرداخت‌ها', coupons: 'کدهای تخفیف', qa: 'پرسش و پاسخ', certs: 'گواهی‌ها', settings: 'تنظیمات سایت' };
    const go = {};
    Object.keys(titles).forEach((k) => { go[k] = () => this.setState({ view: k, qsel: null }); });
    const v = {
      menu: s.view === 'menu', orders: s.view === 'orders', coupons: s.view === 'coupons',
      qaList: s.view === 'qa' && s.qsel === null, qaThread: s.view === 'qa' && s.qsel !== null,
      certs: s.view === 'certs', settings: s.view === 'settings'
    };
    return {
      v, go, title: s.view === 'qa' && s.qsel !== null ? 'پاسخ به پرسش' : titles[s.view], sub: s.view !== 'menu',
      back: () => (this.state.view === 'qa' && this.state.qsel !== null ? this.setState({ qsel: null }) : this.setState({ view: 'menu' })),
      orders, ofilters,
      coupons, couponMeta: fa(s.coupons.filter((c) => c.on).length) + ' کد فعال',
      formOpen: s.form, formClosed: !s.form,
      openForm: () => this.setState({ form: true }), closeForm: () => this.setState({ form: false }),
      code: s.code, amount: s.amount,
      valueLabel: isPct ? 'درصد تخفیف' : 'مبلغ تخفیف (تومان)',
      pctOn: isPct ? 'true' : 'false', fixOn: isPct ? 'false' : 'true',
      pctBg: isPct ? '#FFFFFF' : 'transparent', pctFg: isPct ? '#10201E' : '#4A5B57',
      fixBg: isPct ? 'transparent' : '#FFFFFF', fixFg: isPct ? '#4A5B57' : '#10201E',
      setPct: () => this.setState({ type: 'pct', amount: '۱۵' }), setFix: () => this.setState({ type: 'fix', amount: '۲۰۰٬۰۰۰' }),
      setCode: (e) => this.setState({ code: String(e.target.value).toUpperCase() }), setAmount: (e) => this.setState({ amount: e.target.value }),
      create: () => {
        const st = this.state;
        const value = st.type === 'pct' ? st.amount + '٪' : st.amount + ' تومان';
        this.setState({ coupons: [{ code: st.code || 'NEWCODE', value, course: 'همه دوره‌ها', used: 0, max: 100, exp: 'تا ۳۰ آبان', on: true }].concat(st.coupons), form: false });
      },
      questions, qtabs, cq, quick, qaOpen: fa(openN), qEmpty: questions.length === 0,
      reply: s.reply, setReply: (e) => this.setState({ reply: e.target.value }),
      send: () => {
        const text = (this.state.reply || '').trim() || 'پاسخ شما در درس بعدی کامل توضیح داده شده است.';
        this.setState({ answers: { ...this.state.answers, [this.state.qsel]: text }, reply: '' });
      },
      certs, query: s.query, setQuery: (e) => this.setState({ query: e.target.value }), verify: () => this.setState({ checked: this.state.query }),
      vOk: !!hit && !hit.bad, vBad: !hit || hit.bad, vMsg: hit && hit.bad ? 'این گواهی باطل شده است.' : 'گواهی با این کد پیدا نشد.', vr: hit || call[0],
      stabs, s: sv, saveLabel: s.saved ? 'ذخیره شد' : 'ذخیره تغییرات', saveSettings: () => this.setState({ saved: true })
    };
  }
}
</script>
