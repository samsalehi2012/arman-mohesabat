<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل مدیریت — تنظیمات سایت | آکادمی آرمان محاسبات</title>
<meta name="description" content="نسخه نمایشی سایت و اپ آموزشی آکادمی آرمان محاسبات قشم">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آرمان محاسبات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
body{margin:0;background:#F4F6F5}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .15s ease;cursor:pointer}
.btn:active{transform:scale(.97)}
.bp:hover{background:#08564D !important;color:#FFFFFF !important}
.bg:hover{background:#EDF1F0 !important}
.sn{transition:background-color .2s ease,color .2s ease}.sn:hover{background:rgba(255,255,255,.07) !important;color:#FFFFFF !important}
.tab{transition:color .2s ease,border-color .2s ease}.tab:hover{color:#0B6E63 !important}
.inp{transition:border-color .2s ease,box-shadow .2s ease}.inp:focus{border-color:#0B6E63 !important;box-shadow:0 0 0 4px rgba(11,110,99,.12);outline:0}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .4s cubic-bezier(.2,.7,.2,1.15) both}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>
<body class="web-page">
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="am" dir="rtl" style="background: #F4F6F5; min-height: 100vh; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 1 250px; max-width: 100%; background: #0F1E1C; color: #FFFFFF; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px">
    <a href="admin.html" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF; padding: 0 6px">
      <svg width="36" height="36" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="11" fill="#0B6E63"></rect><path d="M11 26h16M11 19.5h10.5M11 13h6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path><circle cx="26.5" cy="13" r="2.8" fill="#F2B98A"></circle></svg>
      <span style="display: flex; flex-direction: column; line-height: 1.35"><span style="font-weight: 800; font-size: 15px">آرمان محاسبات</span><span style="font-size: 12px; color: #A9B8B5">پنل مدیریت آکادمی</span></span>
    </a>
    <nav aria-label="منوی مدیریت" style="display: flex; flex-direction: column; gap: 2px; font-size: 14px">
      <a class="sn" href="admin.html" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; color: #A9B8B5"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>پیشخوان</a>
      <a class="sn" href="admin-students.html" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; color: #A9B8B5"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg>دانشجویان</a>
      <a class="sn" href="admin-courses.html" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; color: #A9B8B5"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5.5v13L18 12z"></path></svg>دوره‌ها و درس‌ها</a>
      <a class="sn" href="admin-orders.html" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; color: #A9B8B5"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg>سفارش‌ها و پرداخت‌ها</a>
      <a class="sn" href="admin-coupons.html" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; color: #A9B8B5"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="7.5" r="1.2"></circle></svg>کدهای تخفیف</a>
      <a class="sn" href="admin-qa.html" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; color: #A9B8B5"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span style="flex: 1">پرسش و پاسخ</span><span style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: #F2B98A; color: #10201E; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">۷</span></a>
      <a class="sn" href="admin-certificates.html" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; color: #A9B8B5"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg>گواهی‌ها</a>
      <a class="sn" href="admin-settings.html" aria-current="page" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.1); color: #FFFFFF; font-weight: 700"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>تنظیمات سایت</a>
    </nav>
  </aside>

  <main style="flex: 999 1 640px; min-width: 0; padding: 22px clamp(16px, 3vw, 32px) 40px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="font-size: 24px; font-weight: 800">تنظیمات سایت</h1>
      <div style="display: flex; align-items: center; gap: 12px">
        <template data-sc="if" value="{{ saved }}" hint-placeholder-val="{{ false }}"><span class="pop" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #0B6E63; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>ذخیره شد</span></template>
        <button class="btn bp" type="button" onClick="{{ save }}" style="height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">ذخیره تغییرات</button>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; overflow: hidden">
      <div role="tablist" aria-label="بخش‌های تنظیمات" style="display: flex; flex-wrap: wrap; gap: 4px 28px; padding: 0 24px; border-bottom: 1px solid #E3E8E6">
        <template data-sc="for" list="{{ tabs }}" as="t" hint-placeholder-count="5">
          <button class="btn tab" type="button" role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="min-height: 56px; padding: 0; border: 0; border-bottom: 2px solid {{ t.bc }}; background: transparent; font: inherit; font-size: 14px; font-weight: {{ t.fw }}; color: {{ t.color }}">{{ t.label }}</button>
        </template>
      </div>

      <div style="padding: 24px">
        <template data-sc="if" value="{{ v.general }}" hint-placeholder-val="{{ true }}">
          <div class="fade" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 18px 24px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">نام سایت<input class="inp" type="text" value="آکادمی آرمان محاسبات قشم" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">شعار کوتاه<input class="inp" type="text" value="حسابداری را از دل کار واقعی یاد بگیرید" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"></label>
            <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600">لوگو
              <div style="display: flex; align-items: center; gap: 12px"><svg width="52" height="52" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="11" fill="{{ color }}"></rect><path d="M11 26h16M11 19.5h10.5M11 13h6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path><circle cx="26.5" cy="13" r="2.8" fill="#F2B98A"></circle></svg><button class="btn bg" type="button" style="height: 42px; padding: 0 14px; border: 1px solid #DCE3E0; border-radius: 10px; background: #FFFFFF; color: #10201E; font: inherit; font-size: 13px; font-weight: 600">بارگذاری لوگوی جدید</button></div>
            </div>
            <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
              <legend style="font-size: 13px; font-weight: 600; margin-bottom: 8px">رنگ اصلی سایت</legend>
              <div style="display: flex; gap: 10px">
                <template data-sc="for" list="{{ swatches }}" as="w" hint-placeholder-count="4">
                  <button class="btn" type="button" onClick="{{ w.pick }}" aria-pressed="{{ w.sel }}" aria-label="{{ w.name }}" style="width: 44px; height: 44px; border-radius: 12px; border: 3px solid {{ w.ring }}; background: {{ w.hex }}; padding: 0"></button>
                </template>
              </div>
            </fieldset>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">شماره پشتیبانی<input class="inp" type="text" placeholder="[شماره تماس]" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">آدرس دفتر<input class="inp" type="text" placeholder="[آدرس دفتر — قشم]" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"></label>
            <label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">کد نماد اعتماد الکترونیکی<textarea class="inp" rows="2" placeholder="کد HTML نماد را اینجا قرار دهید" dir="ltr" style="border: 1px solid #DCE3E0; border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 13px; color: #10201E; background: #FFFFFF; resize: vertical; text-align: right"></textarea></label>
            <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 32px; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B6E63; margin: 0">حالت تعمیر (سایت برای بازدیدکننده‌ها موقتاً بسته شود)</label>
          </div>
        </template>

        <template data-sc="if" value="{{ v.video }}" hint-placeholder-val="{{ false }}">
          <div class="fade" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 18px 24px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">نام کانال در آپارات<input class="inp" type="text" placeholder="[نام کاربری کانال]" dir="ltr" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF; text-align: right"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">معیار پیش‌فرض تکمیل درس<select class="inp" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"><option>دانشجو دکمه «تکمیل شد» را بزند</option><option>ماندن در صفحه درس به اندازه مدت ویدیو</option><option>هر دو (هرکدام زودتر)</option></select></label>
            <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 32px; cursor: pointer"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0B6E63; margin: 0">رفتن خودکار به درس بعد پس از تکمیل</label>
            <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 32px; cursor: pointer"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0B6E63; margin: 0">درس‌های پیش‌نمایش بدون ورود قابل دیدن باشند</label>
            <p style="grid-column: 1 / -1; font-size: 13px; line-height: 2; color: #4A5B57; padding: 14px 16px; background: #F6F7F6; border-radius: 14px">درس‌ها با لینک صفحه ویدیو در آپارات اضافه می‌شوند (بخش «دوره‌ها و درس‌ها»). ویدیو با پلیر آپارات داخل سایت و اپ پخش می‌شود و درصد پیشرفت بر اساس معیار بالا ثبت می‌شود.</p>
          </div>
        </template>

        <template data-sc="if" value="{{ v.pay }}" hint-placeholder-val="{{ false }}">
          <div class="fade" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 18px 24px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">درگاه پرداخت<select class="inp" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"><option>[نام درگاه پرداخت]</option></select></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">کد پذیرنده (Merchant ID)<input class="inp" type="text" placeholder="xxxxxxxx-xxxx-xxxx" dir="ltr" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF; text-align: right"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">نشانی بازگشت از درگاه<input type="text" value="https://[دامنه سایت]/payment/verify" readonly dir="ltr" style="height: 46px; border: 1px solid #E3E8E6; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 13px; color: #5A6B68; background: #F6F7F6; text-align: right"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">نام حقوقی روی فاکتور<input class="inp" type="text" value="شرکت آرمان محاسبات قشم" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">شناسه ملی شرکت<input class="inp" type="text" placeholder="[شناسه ملی]" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"></label>
            <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 32px; cursor: pointer"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B6E63; margin: 0">حالت آزمایشی درگاه (پرداخت واقعی انجام نمی‌شود)</label>
          </div>
        </template>

        <template data-sc="if" value="{{ v.sms }}" hint-placeholder-val="{{ false }}">
          <div class="fade" style="display: flex; flex-direction: column; gap: 20px">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 18px 24px">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">سامانه پیامک<select class="inp" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"><option>[نام سامانه پیامک]</option></select></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">کلید API<input class="inp" type="password" value="xxxxxxxxxxxx" dir="ltr" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">شماره فرستنده<input class="inp" type="text" placeholder="[شماره خط]" dir="ltr" style="height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF; text-align: right"></label>
            </div>
            <div style="border: 1px solid #E3E8E6; border-radius: 16px; overflow: hidden">
              <div style="padding: 12px 16px; background: #F6F7F6; font-size: 13px; font-weight: 700">پیامک‌های خودکار</div>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #EEF1F0; font-size: 13px"><input type="checkbox" checked disabled style="width: 18px; height: 18px; accent-color: #0B6E63; margin: 0"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b>کد ورود</b><span style="color: #5A6B68">کد ورود شما به آکادمی آرمان محاسبات: {code}</span></span><span style="font-size: 11px; color: #5A6B68">همیشه فعال</span></label>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #EEF1F0; font-size: 13px; cursor: pointer"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0B6E63; margin: 0"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b>تأیید خرید</b><span style="color: #5A6B68">{name} عزیز، دوره «{course}» در پنل شما فعال شد.</span></span></label>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #EEF1F0; font-size: 13px; cursor: pointer"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0B6E63; margin: 0"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b>یادآوری ادامه دوره</b><span style="color: #5A6B68">اگر دانشجو ۷ روز درسی را تمام نکند</span></span></label>
              <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #EEF1F0; font-size: 13px; cursor: pointer"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0B6E63; margin: 0"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b>پاسخ مدرس</b><span style="color: #5A6B68">به پرسش شما در درس «{lesson}» پاسخ داده شد.</span></span></label>

<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'general', color: '#0B6E63', saved: false };
  }
  renderVals() {
    const s = this.state;
    const keys = [['general', 'عمومی'], ['video', 'ویدیو و آپارات'], ['pay', 'درگاه پرداخت'], ['sms', 'پیامک'], ['team', 'مدیران و دسترسی‌ها']];
    const v = {};
    keys.forEach(([k]) => { v[k] = s.tab === k; });
    const tabs = keys.map(([k, label]) => ({
      label, sel: s.tab === k ? 'true' : 'false',
      bc: s.tab === k ? '#0B6E63' : 'transparent', fw: s.tab === k ? '700' : '500', color: s.tab === k ? '#0B6E63' : '#4A5B57',
      pick: () => this.setState({ tab: k, saved: false })
    }));
    const swatches = [['#0B6E63', 'سبز کبود'], ['#2C4A6B', 'سرمه‌ای'], ['#8A4B17', 'قهوه‌ای'], ['#10201E', 'تیره']].map(([hex, name]) => ({
      hex, name, sel: s.color === hex ? 'true' : 'false', ring: s.color === hex ? '#F2B98A' : '#FFFFFF',
      pick: () => this.setState({ color: hex, saved: false })
    }));
    return { tabs, v, swatches, color: s.color, saved: s.saved, save: () => this.setState({ saved: true }) };
  }
}
</script>
