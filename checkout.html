<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورود و پرداخت | آکادمی آرمان محاسبات</title>
<meta name="description" content="نسخه نمایشی سایت و اپ آموزشی آکادمی آرمان محاسبات قشم">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آرمان محاسبات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
body{margin:0;background:#F6F7F6}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .15s ease;cursor:pointer}
.btn:active{transform:scale(.97)}
.bp:hover{background:#08564D !important;color:#FFFFFF !important}
.bg:hover{background:#EDF1F0 !important}
.inp{transition:border-color .2s ease,box-shadow .2s ease}
.inp:focus{border-color:#0B6E63 !important;box-shadow:0 0 0 4px rgba(11,110,99,.12);outline:0}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pop{animation:pop .4s cubic-bezier(.2,.7,.2,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:3px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>
<body class="web-page">
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="am" dir="rtl" style="background: #F6F7F6; min-height: 100vh">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E8E6">
    <div style="max-width: 1080px; margin: 0 auto; padding: 14px clamp(16px, 4vw, 32px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <a href="index.html" style="display: flex; align-items: center; gap: 12px; color: #10201E">
        <svg width="36" height="36" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="11" fill="#0B6E63"></rect><path d="M11 26h16M11 19.5h10.5M11 13h6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path><circle cx="26.5" cy="13" r="2.8" fill="#F2B98A"></circle></svg>
        <span style="font-weight: 800; font-size: 16px">آرمان محاسبات</span>
      </a>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #33433F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>پرداخت امن</span>
      <a href="course.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>بازگشت به دوره</a>
    </div>
  </header>

  <main style="max-width: 1080px; margin: 0 auto; padding: 40px clamp(16px, 4vw, 32px) 80px; display: flex; flex-direction: column; gap: 28px">
    <h1 class="rise" style="font-size: 28px; font-weight: 800">تکمیل خرید</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

      <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

        <!-- Step 1 -->
        <section class="rise d1" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
            <div style="display: flex; align-items: center; gap: 14px">
              <template data-sc="if" value="{{ loggedIn }}" hint-placeholder-val="{{ true }}">
                <span class="pop" style="width: 36px; height: 36px; border-radius: 50%; background: #0B6E63; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
              </template>
              <template data-sc="if" value="{{ notLoggedIn }}" hint-placeholder-val="{{ false }}">
                <span style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #0B6E63; color: #0B6E63; font-weight: 800; display: flex; align-items: center; justify-content: center">۱</span>
              </template>
              <div style="display: flex; flex-direction: column; gap: 2px">
                <h2 style="font-size: 17px; font-weight: 700">ورود با شماره موبایل</h2>
                <template data-sc="if" value="{{ loggedIn }}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; color: #5A6B68">۰۹۱۷ ۱۲۳ ۴۵۶۷ — تأیید شد</span></template>
                <template data-sc="if" value="{{ notLoggedIn }}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #5A6B68">حساب دانشجویی شما با همین شماره ساخته می‌شود</span></template>
              </div>
            </div>
            <template data-sc="if" value="{{ loggedIn }}" hint-placeholder-val="{{ true }}">
              <button class="btn bg" type="button" onClick="{{ editLogin }}" style="height: 44px; padding: 0 16px; background: #FFFFFF; border: 1px solid #DCE3E0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; color: #10201E">تغییر</button>
            </template>
          </div>
          <template data-sc="if" value="{{ notLoggedIn }}" hint-placeholder-val="{{ false }}">
            <div class="pop" style="display: flex; flex-direction: column; gap: 16px; padding-top: 4px">
              <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">شماره موبایل
                <input class="inp" type="tel" value="۰۹۱۷ ۱۲۳ ۴۵۶۷" dir="ltr" style="height: 50px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 16px; text-align: right; color: #10201E; background: #FFFFFF">
              </label>
              <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
                <legend style="font-size: 14px; font-weight: 600; margin-bottom: 8px">کد تأیید پیامک‌شده</legend>
                <div dir="ltr" style="display: flex; gap: 10px; justify-content: flex-end">
                  <input class="inp" aria-label="رقم اول" maxlength="1" value="۴" style="width: 52px; height: 56px; text-align: center; font: inherit; font-size: 22px; font-weight: 700; border: 1px solid #DCE3E0; border-radius: 12px; background: #FFFFFF; color: #10201E">
                  <input class="inp" aria-label="رقم دوم" maxlength="1" value="۸" style="width: 52px; height: 56px; text-align: center; font: inherit; font-size: 22px; font-weight: 700; border: 1px solid #DCE3E0; border-radius: 12px; background: #FFFFFF; color: #10201E">
                  <input class="inp" aria-label="رقم سوم" maxlength="1" value="۲" style="width: 52px; height: 56px; text-align: center; font: inherit; font-size: 22px; font-weight: 700; border: 1px solid #DCE3E0; border-radius: 12px; background: #FFFFFF; color: #10201E">
                  <input class="inp" aria-label="رقم چهارم" maxlength="1" value="" style="width: 52px; height: 56px; text-align: center; font: inherit; font-size: 22px; font-weight: 700; border: 1px solid #0B6E63; border-radius: 12px; background: #FFFFFF; color: #10201E">
                  <input class="inp" aria-label="رقم پنجم" maxlength="1" value="" style="width: 52px; height: 56px; text-align: center; font: inherit; font-size: 22px; font-weight: 700; border: 1px solid #DCE3E0; border-radius: 12px; background: #FFFFFF; color: #10201E">
                </div>
                <span style="font-size: 13px; color: #5A6B68">ارسال دوباره کد تا ۰۱:۴۵</span>
              </fieldset>
              <button class="btn bp" type="button" onClick="{{ confirmLogin }}" style="align-self: flex-start; height: 50px; padding: 0 26px; background: #0B6E63; color: #FFFFFF; border: 0; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700">تأیید و ادامه</button>
            </div>
          </template>
        </section>

        <!-- Step 2 -->
        <section class="rise d2" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; align-items: center; gap: 14px">
            <span style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #0B6E63; color: #0B6E63; font-weight: 800; display: flex; align-items: center; justify-content: center">۲</span>
            <div style="display: flex; flex-direction: column; gap: 2px"><h2 style="font-size: 17px; font-weight: 700">اطلاعات دانشجو</h2><span style="font-size: 14px; color: #5A6B68">نام شما روی گواهی پایان دوره درج می‌شود</span></div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 14px">
            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">نام
              <input class="inp" type="text" value="سارا" style="height: 50px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 15px; color: #10201E; background: #FFFFFF">
            </label>
            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">نام خانوادگی
              <input class="inp" type="text" value="محمدی" style="height: 50px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 15px; color: #10201E; background: #FFFFFF">
            </label>
            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">ایمیل <span style="font-weight: 400; color: #5A6B68; font-size: 13px">(اختیاری، برای ارسال فاکتور)</span>
              <input class="inp" type="email" placeholder="name@example.com" dir="ltr" style="height: 50px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 15px; text-align: right; color: #10201E; background: #FFFFFF">
            </label>
          </div>
        </section>

        <!-- Step 3 -->
        <section class="rise d3" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; align-items: center; gap: 14px">
            <span style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #0B6E63; color: #0B6E63; font-weight: 800; display: flex; align-items: center; justify-content: center">۳</span>
            <h2 style="font-size: 17px; font-weight: 700">روش پرداخت</h2>
          </div>
          <label style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 2px solid #0B6E63; background: #F3F9F7; border-radius: 16px; cursor: pointer">
            <input type="radio" name="pay" checked style="width: 20px; height: 20px; accent-color: #0B6E63; margin: 0">
            <span style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E8E6; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg></span>
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">پرداخت آنلاین</span><span style="font-size: 13px; color: #5A6B68">با همه کارت‌های عضو شتاب · [نام درگاه پرداخت]</span></span>
          </label>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #33433F; cursor: pointer">
            <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0B6E63; margin: 0">
            <span><a href="index.html#about">قوانین آکادمی</a> را خوانده‌ام و می‌پذیرم</span>
          </label>
        </section>
      </div>

      <!-- Summary -->
      <aside class="rise d2" style="flex: 1 1 340px; max-width: 100%; position: sticky; top: 24px; background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 30px 60px -44px rgba(16,32,30,.45)">
        <h2 style="font-size: 17px; font-weight: 800">خلاصه سفارش</h2>
        <div style="display: flex; gap: 14px; align-items: center">
          <span style="flex: none; width: 64px; height: 64px; border-radius: 14px; background-color: #E7ECF2; background-image: linear-gradient(rgba(44,74,107,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(44,74,107,.1) 1px, transparent 1px); background-size: 12px 12px; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2C4A6B" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M19 5L5 19"></path><circle cx="7" cy="7" r="2.5"></circle><circle cx="17" cy="17" r="2.5"></circle></svg></span>
          <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 15px; line-height: 1.7">مالیات بر ارزش افزوده و سامانه مؤدیان</span><span style="font-size: 13px; color: #5A6B68">۲۴ درس · ۹ ساعت · دسترسی دائمی</span></span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="coupon" style="font-size: 14px; font-weight: 600">کد تخفیف</label>
          <div style="display: flex; gap: 8px">
            <input id="coupon" class="inp" type="text" value="ARMAN10" dir="ltr" style="flex: 1; min-width: 0; height: 48px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 15px; text-align: right; color: #10201E; background: #FFFFFF">
            <button class="btn bg" type="button" onClick="{{ toggleCoupon }}" style="height: 48px; padding: 0 18px; background: #FFFFFF; border: 1px solid #10201E; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; color: #10201E">{{ couponBtn }}</button>
          </div>
          <template data-sc="if" value="{{ couponOn }}" hint-placeholder-val="{{ false }}">
            <span class="pop" style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #0B6E63; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>کد تخفیف ۱۰٪ اعمال شد</span>
          </template>
        </div>

        <dl style="margin: 0; display: flex; flex-direction: column; gap: 12px; font-size: 14px; padding-top: 18px; border-top: 1px solid #E3E8E6">
          <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">قیمت دوره</dt><dd style="margin: 0">۲٬۲۰۰٬۰۰۰ تومان</dd></div>
          <div style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">تخفیف دوره</dt><dd style="margin: 0; color: #9A4515">−۳۵۰٬۰۰۰ تومان</dd></div>
          <template data-sc="if" value="{{ couponOn }}" hint-placeholder-val="{{ false }}">
            <div class="pop" style="display: flex; justify-content: space-between"><dt style="color: #5A6B68">کد تخفیف</dt><dd style="margin: 0; color: #9A4515">−۱۸۵٬۰۰۰ تومان</dd></div>
          </template>
          <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px dashed #E3E8E6"><dt style="font-weight: 700">مبلغ قابل پرداخت</dt><dd style="margin: 0"><span style="font-size: 24px; font-weight: 800">{{ total }}</span> <span style="color: #5A6B68">تومان</span></dd></div>
        </dl>

        <a class="btn bp" href="dashboard.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; background: #0B6E63; color: #FFFFFF; border-radius: 14px; font-weight: 700; font-size: 16px">پرداخت و شروع دوره</a>
        <p style="font-size: 13px; line-height: 1.9; color: #5A6B68; text-align: center">بعد از پرداخت، دوره همان لحظه در پنل دانشجو و اپ موبایل فعال می‌شود.</p>
      </aside>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { loggedIn: true, coupon: false };
  }
  renderVals() {
    const s = this.state;
    return {
      loggedIn: s.loggedIn,
      notLoggedIn: !s.loggedIn,
      editLogin: () => this.setState({ loggedIn: false }),
      confirmLogin: () => this.setState({ loggedIn: true }),
      couponOn: s.coupon,
      couponBtn: s.coupon ? 'حذف' : 'اعمال',
      toggleCoupon: () => this.setState({ coupon: !this.state.coupon }),
      total: s.coupon ? '۱٬۶۶۵٬۰۰۰' : '۱٬۸۵۰٬۰۰۰'
    };
  }
}
</script>
<script src="assets/dc-lite.js" defer></script>
<noscript><p style="font-family:Tahoma,sans-serif;padding:24px;direction:rtl">برای دیدن این نسخه نمایشی، جاوااسکریپت مرورگر را روشن کنید.</p></noscript>
</body>
</html>
