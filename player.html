<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تماشای دوره و پیشرفت | آکادمی آرمان محاسبات</title>
<meta name="description" content="نسخه نمایشی سایت و اپ آموزشی آکادمی آرمان محاسبات قشم">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آرمان محاسبات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
body{margin:0;background:#F6F7F6}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .15s ease;cursor:pointer}
.btn:active{transform:scale(.97)}
.bp:hover{background:#08564D !important;color:#FFFFFF !important}
.bg:hover{background:#EDF1F0 !important}
.ls{transition:background-color .2s ease}.ls:hover{background:#F2F5F4 !important}
.barT{transition:width .7s cubic-bezier(.2,.7,.2,1)}
.ringT{transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1)}
.tab{transition:color .2s ease,border-color .2s ease}.tab:hover{color:#0B6E63 !important}
.pop{animation:pop .4s cubic-bezier(.2,.7,.2,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 0 0 18px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>
<body class="web-page">
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="am" dir="rtl" style="background: #F6F7F6; min-height: 100vh; display: flex; flex-direction: column">

  <!-- Top bar -->
  <header style="position: sticky; top: 0; z-index: 10; background: #FFFFFF; border-bottom: 1px solid #E3E8E6">
    <div style="padding: 12px clamp(16px, 3vw, 28px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
      <div style="display: flex; align-items: center; gap: 14px; min-width: 0">
        <a class="btn bg" href="dashboard.html" aria-label="بازگشت به پنل" style="flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E3E8E6; display: flex; align-items: center; justify-content: center; color: #10201E; background: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 12px; color: #5A6B68">پنل دانشجو / دوره‌های من</span>
          <h1 style="font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">مالیات بر ارزش افزوده و سامانه مؤدیان</h1>
        </div>
      </div>
      <div style="flex: 1 1 280px; max-width: 420px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #5A6B68">{{ doneLabel }}</span><span style="font-weight: 800; color: #0B6E63">{{ pctLabel }}</span></div>
        <div role="progressbar" aria-label="پیشرفت دوره" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pct }}" style="height: 8px; background: #EDF1F0; border-radius: 99px; overflow: hidden"><div class="barT" style="height: 100%; width: {{ pctCss }}; background: #0B6E63; border-radius: 99px"></div></div>
      </div>
      <template data-sc="if" value="{{ complete }}" hint-placeholder-val="{{ false }}">
        <a class="btn pop" href="dashboard.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 12px; background: #B4541A; color: #FFFFFF; font-weight: 700; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg>دریافت گواهی</a>
      </template>
      <template data-sc="if" value="{{ notComplete }}" hint-placeholder-val="{{ true }}">
        <span style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px dashed #D5DDDA; color: #5A6B68; font-size: 13px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg>گواهی پس از ۱۰۰٪</span>
      </template>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: flex-start">

    <!-- Main -->
    <main style="flex: 999 1 640px; min-width: 0; padding: 24px clamp(16px, 3vw, 28px) 48px; display: flex; flex-direction: column; gap: 22px">
      <figure style="margin: 0; position: relative; aspect-ratio: 16 / 9; max-height: 560px; border-radius: 20px; background: #0C1816; overflow: hidden; display: flex; align-items: center; justify-content: center">
        <div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 40px 40px"></div>
        <span style="position: absolute; top: 16px; right: 18px; color: rgba(255,255,255,.9); font-size: 14px; font-weight: 600">{{ curTitle }}</span>
        <span style="position: absolute; top: 14px; left: 16px; font-size: 12px; color: rgba(255,255,255,.85); padding: 3px 10px; border: 1px solid rgba(255,255,255,.28); border-radius: 999px">پخش از آپارات</span>
        <button class="btn pulse" type="button" aria-label="پخش درس" style="position: relative; width: 88px; height: 88px; border-radius: 50%; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5v13L18 12z" fill="#0B6E63"></path></svg></button>
        <div aria-hidden="true" style="position: absolute; bottom: 0; right: 0; left: 0; padding: 14px 18px; display: flex; align-items: center; gap: 14px; color: rgba(255,255,255,.85); font-size: 12px; background: linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0))">
          <span>۰۰:۰۰</span>
          <span style="flex: 1; height: 4px; border-radius: 99px; background: rgba(255,255,255,.22)"></span>
          <span>{{ curDur }}</span>
          <span>۷۲۰p</span>
        </div>
      </figure>

      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; color: #0B6E63; font-weight: 600">{{ curMeta }}</span>
          <h2 style="font-size: 22px; font-weight: 800; line-height: 1.6">{{ curTitle }}</h2>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <button class="btn bg" type="button" onClick="{{ prev }}" style="height: 46px; padding: 0 16px; background: #FFFFFF; border: 1px solid #DCE3E0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; color: #10201E; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>درس قبلی</button>
          <template data-sc="if" value="{{ curDone }}" hint-placeholder-val="{{ false }}">
            <button class="btn pop" type="button" onClick="{{ toggleDone }}" aria-pressed="true" style="height: 46px; padding: 0 18px; background: #E3F1EE; border: 1px solid #0B6E63; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; color: #0B6E63; display: inline-flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>تکمیل شد</button>
          </template>
          <template data-sc="if" value="{{ curNotDone }}" hint-placeholder-val="{{ true }}">
            <button class="btn bp" type="button" onClick="{{ toggleDone }}" aria-pressed="false" style="height: 46px; padding: 0 18px; background: #0B6E63; border: 1px solid #0B6E63; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; color: #FFFFFF; display: inline-flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg>علامت‌گذاری به‌عنوان تکمیل‌شده</button>
          </template>
          <button class="btn bg" type="button" onClick="{{ next }}" style="height: 46px; padding: 0 16px; background: #FFFFFF; border: 1px solid #DCE3E0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; color: #10201E; display: inline-flex; align-items: center; gap: 6px">درس بعدی<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
        </div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; overflow: hidden">
        <div role="tablist" aria-label="بخش‌های درس" style="display: flex; flex-wrap: wrap; gap: 4px 26px; padding: 0 22px; border-bottom: 1px solid #E3E8E6">
          <template data-sc="for" list="{{ tabs }}" as="t" hint-placeholder-count="4">
            <button class="btn tab" type="button" role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="min-height: 54px; padding: 0; background: transparent; border: 0; border-bottom: 2px solid {{ t.bc }}; font: inherit; font-size: 14px; font-weight: {{ t.fw }}; color: {{ t.color }}">{{ t.label }}</button>
          </template>
        </div>
        <div style="padding: 22px">
          <template data-sc="if" value="{{ tabDesc }}" hint-placeholder-val="{{ false }}">
            <p class="fade" style="font-size: 15px; line-height: 2.05; color: #33433F">در این درس، مبحث «{{ curTitle }}» را با مثال‌های کاربردی و نمونه‌اسناد واقعی مرور می‌کنیم. فایل تمرین در بخش پیوست‌ها قرار دارد.</p>
          </template>
          <template data-sc="if" value="{{ tabFiles }}" hint-placeholder-val="{{ false }}">
            <ul class="fade" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
              <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1px solid #E3E8E6; border-radius: 14px">
                <span style="display: flex; align-items: center; gap: 12px"><span style="width: 40px; height: 40px; border-radius: 10px; background: #EAF0E4; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F6B2E" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 4v16"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 14px">فایل تمرین درس.xlsx</span><span style="font-size: 12px; color: #5A6B68">اکسل · ۲۴۰ کیلوبایت</span></span></span>
                <button class="btn bg" type="button" style="height: 44px; padding: 0 14px; border: 1px solid #DCE3E0; background: #FFFFFF; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 600; color: #10201E; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>دانلود</button>
              </li>
              <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1px solid #E3E8E6; border-radius: 14px">
                <span style="display: flex; align-items: center; gap: 12px"><span style="width: 40px; height: 40px; border-radius: 10px; background: #F4ECE2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A4B17" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 14px">جزوه خلاصه درس.pdf</span><span style="font-size: 12px; color: #5A6B68">PDF · ۱٫۲ مگابایت</span></span></span>
                <button class="btn bg" type="button" style="height: 44px; padding: 0 14px; border: 1px solid #DCE3E0; background: #FFFFFF; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 600; color: #10201E; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>دانلود</button>
              </li>
            </ul>
          </template>
          <template data-sc="if" value="{{ tabNotes }}" hint-placeholder-val="{{ false }}">
            <div class="fade" style="display: flex; flex-direction: column; gap: 14px">
              <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">یادداشت جدید
                <textarea rows="3" placeholder="نکته‌ای که می‌خواهید بعداً مرور کنید…" style="resize: vertical; border: 1px solid #DCE3E0; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF"></textarea>
              </label>
              <button class="btn bp" type="button" style="align-self: flex-start; height: 44px; padding: 0 18px; background: #0B6E63; color: #FFFFFF; border: 0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700">ذخیره یادداشت</button>
              <div style="padding: 14px 16px; background: #F6F7F6; border-radius: 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #0B6E63; font-weight: 600">دقیقه ۰۸:۱۲</span><span style="font-size: 14px; line-height: 1.9">حساب مالیات و عوارض دریافتنی و پرداختنی جدا نگه داشته شود؛ پایان فصل تهاتر.</span></div>
            </div>
          </template>
          <template data-sc="if" value="{{ tabQa }}" hint-placeholder-val="{{ true }}">
            <div class="fade" style="display: flex; flex-direction: column; gap: 16px">
              <div style="display: flex; gap: 10px">
                <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">پرسش شما</label>
                <input id="q" type="text" placeholder="پرسش خود درباره این درس را بنویسید…" style="flex: 1; min-width: 0; height: 48px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF">
                <button class="btn bp" type="button" style="height: 48px; padding: 0 18px; background: #0B6E63; color: #FFFFFF; border: 0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700">ارسال</button>
              </div>
              <article style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid #E3E8E6; border-radius: 16px">
                <div style="display: flex; gap: 12px"><span style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #E7ECF2; color: #2C4A6B; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">ع ر</span><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px"><b>علی رضایی</b> <span style="color: #5A6B68">· ۲ روز پیش</span></span><p style="font-size: 14px; line-height: 1.9">برای فروش‌های معاف هم باید همین ثبت‌ها را انجام بدهیم؟</p></div></div>
                <div style="display: flex; gap: 12px; margin-right: 48px; padding: 12px 14px; background: #F3F9F7; border-radius: 12px"><span style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: #0B6E63; color: #FFFFFF; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center">م</span><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px"><b>مدرس دوره</b> <span style="padding: 1px 8px; background: #0B6E63; color: #FFFFFF; border-radius: 999px; font-size: 11px">پاسخ مدرس</span></span><p style="font-size: 14px; line-height: 1.9">در درس ۸ همین حالت را با مثال توضیح داده‌ایم؛ فایل نمونه هم در پیوست‌های آن درس هست.</p></div></div>
              </article>
              <article style="display: flex; gap: 12px; padding: 16px; border: 1px solid #E3E8E6; border-radius: 16px"><span style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #F4ECE2; color: #8A4B17; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">ن ک</span><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px"><b>نرگس کریمی</b> <span style="color: #5A6B68">· ۵ ساعت پیش · در انتظار پاسخ</span></span><p style="font-size: 14px; line-height: 1.9">اگر اعتبار مالیاتی از بدهی بیشتر باشد، ثبت پایان فصل چطور است؟</p></div></article>
            </div>
          </template>
        </div>
      </div>
    </main>

    <!-- Lesson list -->
    <aside aria-label="محتوای دوره" style="flex: 1 1 340px; max-width: 100%; align-self: stretch; background: #FFFFFF; border-right: 1px solid #E3E8E6; display: flex; flex-direction: column; position: sticky; top: 69px; max-height: calc(100vh - 69px)">
      <div style="padding: 20px 22px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #E3E8E6">
        <svg width="52" height="52" viewBox="0 0 52 52" role="img" aria-label="{{ pctLabel }}"><circle cx="26" cy="26" r="21" fill="none" stroke="#EDF1F0" stroke-width="6"></circle><circle class="ringT" cx="26" cy="26" r="21" fill="none" stroke="#0B6E63" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="{{ ringOffset }}" transform="rotate(-90 26 26)"></circle></svg>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 800; font-size: 16px">محتوای دوره</span><span style="font-size: 13px; color: #5A6B68">{{ doneLabel }}</span></div>
      </div>
      <div style="overflow-y: auto; padding: 8px 10px 20px">
        <template data-sc="for" list="{{ sections }}" as="sec" hint-placeholder-count="4">
          <div style="padding: 14px 12px 6px; display: flex; justify-content: space-between; gap: 10px; font-size: 13px">
            <span style="font-weight: 700; color: #33433F">{{ sec.title }}</span>
            <span style="color: #5A6B68; white-space: nowrap">{{ sec.count }}</span>
          </div>
          <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
            <template data-sc="for" list="{{ sec.lessons }}" as="l" hint-placeholder-count="5">
              <li>
                <button class="btn ls" type="button" onClick="{{ l.pick }}" aria-current="{{ l.aria }}" style="width: 100%; min-height: 56px; padding: 8px 12px; display: flex; align-items: center; gap: 12px; border: 0; border-radius: 12px; font: inherit; color: #10201E; text-align: right; background: {{ l.bg }}">
                  <template data-sc="if" value="{{ l.done }}" hint-placeholder-val="{{ true }}">
                    <span style="flex: none; width: 24px; height: 24px; border-radius: 50%; background: #0B6E63; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="تکمیل‌شده" role="img"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
                  </template>
                  <template data-sc="if" value="{{ l.todo }}" hint-placeholder-val="{{ false }}">
                    <span style="flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #CFD8D5"></span>
                  </template>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; text-align: right">
                    <span style="font-size: 14px; line-height: 1.7">{{ l.title }}</span>
                    <span style="font-size: 12px; color: #5A6B68">{{ l.sub }}</span>
                  </span>
                  <template data-sc="if" value="{{ l.current }}" hint-placeholder-val="{{ false }}">
                    <span style="flex: none; font-size: 11px; font-weight: 700; color: #0B6E63; background: #FFFFFF; padding: 2px 8px; border-radius: 999px">در حال پخش</span>
                  </template>
                </button>
              </li>
            </template>
          </ol>
        </template>
      </div>
    </aside>
  </div>
</div>
</template>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const done = {};
    for (let i = 0; i < 15; i++) done[i] = true;
    this.state = { done, cur: 15, tab: 'qa' };
  }
  fa(n) { return String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]); }
  renderVals() {
    const data = [
      { title: 'فصل ۱ · آشنایی با ارزش افزوده', lessons: [['معرفی دوره و نقشه راه', '۰۶:۲۰'], ['قانون ارزش افزوده در یک نگاه', '۱۸:۴۵'], ['کالاها و خدمات معاف', '۲۲:۱۰'], ['نرخ مالیات و عوارض', '۱۹:۳۰'], ['اعتبار مالیاتی و نحوه محاسبه', '۲۴:۵۰']] },
      { title: 'فصل ۲ · سامانه مؤدیان', lessons: [['ثبت‌نام و ورود به سامانه مؤدیان', '۲۱:۰۵'], ['کارپوشه و شناسه یکتای حافظه مالیاتی', '۲۶:۴۰'], ['انواع صورتحساب الکترونیکی', '۲۳:۱۵'], ['صدور صورتحساب نوع اول و دوم', '۲۸:۳۰'], ['ابطال، اصلاح و برگشت از فروش', '۲۲:۵۵'], ['ارسال از طریق شرکت معتمد', '۱۷:۲۰'], ['خطاهای رایج و رفع آن‌ها', '۲۰:۱۰']] },
      { title: 'فصل ۳ · اظهارنامه و دفاتر', lessons: [['تهیه اظهارنامه فصلی', '۲۷:۰۰'], ['ثبت‌های حسابداری خرید و فروش', '۲۵:۳۵'], ['تطبیق دفاتر با سامانه', '۲۳:۴۰'], ['حساب‌های مالیات و عوارض', '۱۹:۵۰'], ['مطالبه و استرداد اعتبار', '۲۱:۱۵'], ['نمونه کامل یک فصل کاری', '۳۲:۲۰'], ['تمرین جامع با فایل اکسل', '۲۲:۰۵']] },
      { title: 'فصل ۴ · رسیدگی و جمع‌بندی', lessons: [['فرایند رسیدگی و برگ تشخیص', '۲۴:۱۰'], ['اعتراض و هیئت‌های حل اختلاف', '۲۲:۴۵'], ['جرائم رایج و راه پیشگیری', '۱۹:۲۰'], ['چک‌لیست ماهانه حسابدار', '۱۵:۳۰'], ['جمع‌بندی و آزمون پایانی', '۱۴:۰۵']] }
    ];
    const s = this.state;
    const flat = [];
    data.forEach((sec, si) => sec.lessons.forEach((l, li) => flat.push({ t: l[0], d: l[1], si, li })));
    const total = flat.length;
    const doneCount = flat.filter((_, i) => s.done[i]).length;
    const pct = Math.floor((doneCount / total) * 100);
    const cur = flat[s.cur];
    let idx = 0;
    const sections = data.map((sec, si) => {
      const start = idx;
      const lessons = sec.lessons.map((l) => {
        const i = idx++;
        const isCur = i === s.cur;
        const isDone = !!s.done[i];
        return {
          title: l[0],
          sub: 'درس ' + this.fa(i + 1) + ' · ' + l[1],
          done: isDone, todo: !isDone, current: isCur,
          aria: isCur ? 'true' : 'false',
          bg: isCur ? '#E3F1EE' : '#FFFFFF',
          pick: () => this.setState({ cur: i })
        };
      });
      const secDone = sec.lessons.filter((_, k) => s.done[start + k]).length;
      return { title: sec.title, count: this.fa(secDone) + ' از ' + this.fa(sec.lessons.length), lessons };
    });
    const tabDefs = [['desc', 'توضیحات'], ['files', 'فایل‌های پیوست (۲)'], ['notes', 'یادداشت‌های من'], ['qa', 'پرسش و پاسخ (۲)']];
    const tabs = tabDefs.map(([k, label]) => ({
      label,
      sel: s.tab === k ? 'true' : 'false',
      pick: () => this.setState({ tab: k }),
      bc: s.tab === k ? '#0B6E63' : 'transparent',
      fw: s.tab === k ? '700' : '500',
      color: s.tab === k ? '#0B6E63' : '#4A5B57'
    }));
    return {
      sections, tabs,
      tabDesc: s.tab === 'desc', tabFiles: s.tab === 'files', tabNotes: s.tab === 'notes', tabQa: s.tab === 'qa',
      pct, pctLabel: this.fa(pct) + '٪', pctCss: pct + '%', ringOffset: 100 - pct,
      doneLabel: this.fa(doneCount) + ' از ' + this.fa(total) + ' درس تکمیل‌شده',
      complete: pct === 100, notComplete: pct !== 100,
      curTitle: cur.t, curDur: cur.d,
      curMeta: 'فصل ' + this.fa(cur.si + 1) + ' · درس ' + this.fa(s.cur + 1) + ' از ' + this.fa(total),
      curDone: !!s.done[s.cur], curNotDone: !s.done[s.cur],
      toggleDone: () => this.setState({ done: { ...this.state.done, [this.state.cur]: !this.state.done[this.state.cur] } }),
      next: () => this.setState({ cur: Math.min(total - 1, this.state.cur + 1) }),
      prev: () => this.setState({ cur: Math.max(0, this.state.cur - 1) })
    };
  }
}
</script>
