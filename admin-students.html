<style>
body{margin:0;background:#F4F6F5}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .15s ease;cursor:pointer}
.btn:active{transform:scale(.97)}
.bp:hover{background:#08564D !important;color:#FFFFFF !important}
.bg:hover{background:#EDF1F0 !important}
.sn{transition:background-color .2s ease,color .2s ease}.sn:hover{background:rgba(255,255,255,.07) !important;color:#FFFFFF !important}
.tr{transition:background-color .2s ease}.tr:hover{background:#F8FAF9}
.barT{transition:width .6s cubic-bezier(.2,.7,.2,1)}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.swap{animation:swap .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes swap{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>

      { name: 'علی رضایی', mobile: '۰۹۳۹ ۱۰۴ ۶۵۲۸', last: '۲ روز پیش', status: 'active', joined: '۵ شهریور ۱۴۰۵', paid: '۱٬۸۵۰٬۰۰۰ تومان',
        courses: [['مالیات بر ارزش افزوده', 58, 'آخرین درس: ۱۴ · ۲ روز پیش']] },
      { name: 'نرگس کریمی', mobile: '۰۹۱۶ ۸۸۰ ۱۲۷۵', last: '۵ ساعت پیش', status: 'active', joined: '۱۲ خرداد ۱۴۰۵', paid: '۴٬۰۵۰٬۰۰۰ تومان',
        courses: [['مالیات بر ارزش افزوده', 96, 'آخرین درس: ۲۳ · امروز'], ['حسابداری مالیاتی', 88, 'آخرین درس: ۲۷ · هفته پیش']] },
      { name: 'امیر صادقی', mobile: '۰۹۱۳ ۶۰۲ ۴۴۱۹', last: '۴۰ روز پیش', status: 'blocked', joined: '۸ اردیبهشت ۱۴۰۵', paid: '۱٬۲۰۰٬۰۰۰ تومان',
        courses: [['اکسل برای حسابداران', 12, 'آخرین درس: ۴ · ۴۰ روز پیش']] }
    ];
    const st = {
      active: { label: 'فعال', bg: '#E3F1EE', fg: '#0B6E63' },
      none: { label: 'بدون خرید', bg: '#F1F3F2', fg: '#4A5B57' },
      blocked: { label: 'مسدود', bg: '#FBEFE4', fg: '#9A4515' }
    };
    const sel = this.state.sel;
    const enrich = (p, i) => {
      const avg = p.courses.length ? Math.round(p.courses.reduce((a, c) => a + c[1], 0) / p.courses.length) : 0;
      const parts = p.name.split(' ');
      return {
        ...p,
        ini: parts[0][0] + ' ' + parts[parts.length - 1][0],
        tint: tints[i % tints.length],
        status: st[p.status].label, stBg: st[p.status].bg, stFg: st[p.status].fg,
        count: p.courses.length ? fa(p.courses.length) + ' دوره' : '—',
        pctLabel: fa(avg) + '٪', pctCss: avg + '%',
        none: p.courses.length === 0,
        courses: p.courses.map((c) => ({ title: c[0], pctLabel: fa(c[1]) + '٪', pctCss: c[1] + '%', sub: c[2], color: c[1] === 100 ? '#B4541A' : '#0B6E63' }))
      };
    };
    const rows = people.map((p, i) => ({
      ...enrich(p, i),
      bg: i === sel ? '#F1F8F6' : '#FFFFFF',
      pressed: i === sel ? 'true' : 'false',
      pick: () => this.setState({ sel: i })
    }));
    return { rows, s: rows[sel] };
  }
}
