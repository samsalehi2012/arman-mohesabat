<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صفحه دوره — مالیات بر ارزش افزوده | آرمان محاسبات قشم</title>
<meta name="description" content="نسخه نمایشی سایت و اپ آموزشی آکادمی آرمان محاسبات قشم">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آرمان محاسبات قشم">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
body{margin:0;background:#F6F7F6}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am h4,.am p{margin:0}
.btn{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .15s ease;cursor:pointer}
.btn:active{transform:scale(.97)}
.bp:hover{background:#08564D !important;color:#FFFFFF !important}
.bg:hover{background:#EDF1F0 !important}
.nl{transition:color .2s ease}.nl:hover{color:#0B6E63 !important}
.row{transition:background-color .2s ease}.row:hover{background:#F6F7F6 !important}
.chev{transition:transform .3s cubic-bezier(.2,.7,.2,1)}.rot{transform:rotate(180deg)}
.open{animation:open .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 0 0 18px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
details[open] .fq{transform:rotate(45deg)}
.fq{transition:transform .3s ease}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:3px;border-radius:10px}
@media (max-width:760px){.hdr-nav{display:none !important}}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>
<body class="web-page">
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="am" dir="rtl" style="background: #F6F7F6; min-height: 100vh">

  <header style="position: sticky; top: 0; z-index: 10; background: rgba(246,247,246,.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid #E3E8E6">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px clamp(16px, 4vw, 32px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="index.html" style="display: flex; align-items: center; gap: 12px; color: #10201E">
        <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="11" fill="#0B6E63"></rect><path d="M11 26h16M11 19.5h10.5M11 13h6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path><circle cx="26.5" cy="13" r="2.8" fill="#F2B98A"></circle></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.35"><span style="font-weight: 800; font-size: 17px">آرمان محاسبات قشم</span><span style="font-size: 12px; color: #5A6B68">آکادمی آموزش حسابداری</span></span>
      </a>
      <nav class="hdr-nav" aria-label="منوی اصلی" style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 15px; font-weight: 500">
        <a class="nl" href="index.html#courses" style="color: #0B6E63">دوره‌ها</a>
        <a class="nl" href="index.html#how" style="color: #33433F">روش یادگیری</a>
        <a class="nl" href="index.html#app" style="color: #33433F">اپلیکیشن</a>
        <a class="nl" href="index.html#about" style="color: #33433F">درباره ما</a>
      </nav>
      <a class="btn bp" href="dashboard.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; background: #0B6E63; color: #FFFFFF; border-radius: 12px; font-weight: 600; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        ورود / ثبت‌نام
      </a>
    </div>
  </header>

  <div style="max-width: 1200px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 32px) 80px; display: flex; flex-direction: column; gap: 24px">
    <nav aria-label="مسیر صفحه" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: #5A6B68">
      <a class="nl" href="index.html" style="color: #5A6B68">خانه</a><span aria-hidden="true">/</span>
      <a class="nl" href="index.html#courses" style="color: #5A6B68">دوره‌ها</a><span aria-hidden="true">/</span>
      <span style="color: #10201E">مالیات بر ارزش افزوده و سامانه مؤدیان</span>
    </nav>

    <div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">

      <!-- Main column -->
      <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 40px">
        <div class="rise" style="display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <span style="padding: 4px 12px; background: #E7ECF2; color: #2C4A6B; border-radius: 999px; font-size: 13px; font-weight: 600">مالیات</span>
            <span style="padding: 4px 12px; background: #FFFFFF; border: 1px solid #E3E8E6; color: #33433F; border-radius: 999px; font-size: 13px">سطح متوسط</span>
          </div>
          <h1 style="font-size: clamp(28px, 3vw, 40px); font-weight: 800; line-height: 1.6; text-wrap: balance">مالیات بر ارزش افزوده و سامانه مؤدیان</h1>
          <p style="font-size: 16px; line-height: 2; color: #4A5B57; max-width: 720px">از مفاهیم پایه ارزش افزوده تا صدور صورتحساب الکترونیکی، تهیه اظهارنامه و ثبت درست در دفاتر — با مثال‌های واقعی و فایل تمرین.</p>
          <div style="display: flex; flex-wrap: wrap; gap: 10px 24px; font-size: 14px; color: #33433F">
            <span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6B68" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg>۲۴ درس</span>
            <span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6B68" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>۹ ساعت ویدیو</span>
            <span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6B68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg>گواهی پایان دوره</span>
            <span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6B68" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>مدرس: [نام مدرس]</span>
          </div>
        </div>

        <figure class="rise d1" style="margin: 0; position: relative; aspect-ratio: 16 / 9; border-radius: 22px; background: #10201E; overflow: hidden; display: flex; align-items: center; justify-content: center">
          <div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 36px 36px"></div>
          <button class="btn pulse" type="button" aria-label="پخش ویدیوی معرفی" style="position: relative; width: 84px; height: 84px; border-radius: 50%; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5v13L18 12z" fill="#0B6E63"></path></svg>
          </button>
          <figcaption style="position: absolute; bottom: 0; right: 0; left: 0; padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; color: #FFFFFF; font-size: 14px; background: linear-gradient(0deg, rgba(16,32,30,.85), rgba(16,32,30,0))">
            <span style="font-weight: 600">ویدیوی معرفی دوره</span>
            <span style="font-size: 12px; padding: 3px 10px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px">پخش از آپارات</span>
          </figcaption>
        </figure>

        <nav aria-label="بخش‌های صفحه" style="position: sticky; top: 72px; z-index: 5; background: #F6F7F6; border-bottom: 1px solid #E3E8E6; display: flex; flex-wrap: wrap; gap: 28px; font-size: 15px; font-weight: 600">
          <a class="nl" href="#learn" style="color: #0B6E63; padding: 14px 0; border-bottom: 2px solid #0B6E63">معرفی</a>
          <a class="nl" href="#syllabus" style="color: #4A5B57; padding: 14px 0">سرفصل‌ها</a>
          <a class="nl" href="#teacher" style="color: #4A5B57; padding: 14px 0">مدرس</a>
          <a class="nl" href="#faq" style="color: #4A5B57; padding: 14px 0">سؤالات متداول</a>
        </nav>

        <section id="learn" style="display: flex; flex-direction: column; gap: 20px">
          <h2 style="font-size: 22px; font-weight: 800">در این دوره یاد می‌گیرید</h2>
          <ul style="list-style: none; margin: 0; padding: 24px; background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px 28px; font-size: 15px; line-height: 1.8">
            <li style="display: flex; gap: 10px"><svg style="flex: none; margin-top: 4px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>مفاهیم، نرخ‌ها و معافیت‌های ارزش افزوده</li>
            <li style="display: flex; gap: 10px"><svg style="flex: none; margin-top: 4px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>کار با کارپوشه سامانه مؤدیان</li>
            <li style="display: flex; gap: 10px"><svg style="flex: none; margin-top: 4px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>صدور، ابطال و اصلاح صورتحساب الکترونیکی</li>
            <li style="display: flex; gap: 10px"><svg style="flex: none; margin-top: 4px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>تهیه و ارسال اظهارنامه فصلی</li>
            <li style="display: flex; gap: 10px"><svg style="flex: none; margin-top: 4px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>ثبت‌های حسابداری خرید و فروش مشمول</li>
            <li style="display: flex; gap: 10px"><svg style="flex: none; margin-top: 4px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>رسیدگی، اعتراض و پیشگیری از جرائم</li>
          </ul>
        </section>

        <!-- Syllabus (interactive accordion) -->
        <section id="syllabus" style="display: flex; flex-direction: column; gap: 20px">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <h2 style="font-size: 22px; font-weight: 800">سرفصل‌ها</h2>
              <span style="font-size: 14px; color: #5A6B68">۴ فصل · ۲۴ درس · ۹ ساعت</span>
            </div>
            <button class="btn bg" type="button" onClick="{{ toggleAll }}" style="height: 44px; padding: 0 16px; background: #FFFFFF; border: 1px solid #DCE3E0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; color: #10201E">{{ allLabel }}</button>
          </div>
          <div style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; overflow: hidden">
            <template data-sc="for" list="{{ sections }}" as="sec" hint-placeholder-count="4">
              <div style="border-bottom: 1px solid #E3E8E6">
                <button class="btn row" type="button" onClick="{{ sec.toggle }}" aria-expanded="{{ sec.expanded }}" style="width: 100%; min-height: 68px; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #FFFFFF; border: 0; font: inherit; color: #10201E; text-align: right">
                  <span style="display: flex; align-items: center; gap: 14px">
                    <span style="width: 34px; height: 34px; border-radius: 10px; background: #E3F1EE; color: #0B6E63; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center">{{ sec.num }}</span>
                    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 16px">{{ sec.title }}</span><span style="font-size: 13px; color: #5A6B68">{{ sec.meta }}</span></span>
                  </span>
                  <svg class="{{ sec.chevCls }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                </button>
                <template data-sc="if" value="{{ sec.isOpen }}" hint-placeholder-val="{{ true }}">
                  <ol class="open" style="list-style: none; margin: 0; padding: 0 22px 12px">
                    <template data-sc="for" list="{{ sec.lessons }}" as="l" hint-placeholder-count="5">
                      <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 48px 8px 0; border-top: 1px dashed #E3E8E6; font-size: 15px">
                        <span style="display: flex; align-items: center; gap: 12px; min-width: 0">
                          <span style="flex: none; width: 24px; color: #5A6B68; font-size: 13px">{{ l.num }}</span>
                          <span style="color: #10201E">{{ l.title }}</span>
                        </span>
                        <span style="flex: none; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #5A6B68">
                          <template data-sc="if" value="{{ l.preview }}" hint-placeholder-val="{{ false }}">
                            <a href="player.html" style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: #E3F1EE; color: #0B6E63; border-radius: 999px; font-weight: 600; font-size: 12px"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5v13L17 12z" fill="#0B6E63"></path></svg>پیش‌نمایش رایگان</a>
                          </template>
                          <template data-sc="if" value="{{ l.locked }}" hint-placeholder-val="{{ true }}">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9794" stroke-width="1.8" stroke-linecap="round" aria-label="قفل — پس از خرید" role="img"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
                          </template>
                          <span style="min-width: 44px; text-align: left">{{ l.dur }}</span>
                        </span>
                      </li>
                    </template>
                  </ol>
                </template>
              </div>
            </template>
          </div>
        </section>

        <section id="teacher" style="display: flex; flex-direction: column; gap: 20px">
          <h2 style="font-size: 22px; font-weight: 800">مدرس دوره</h2>
          <div style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 20px; padding: 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
            <span style="flex: none; width: 76px; height: 76px; border-radius: 22px; background: #E3F1EE; color: #0B6E63; display: flex; align-items: center; justify-content: center; font-size: 13px; text-align: center">[عکس]</span>
            <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 18px; font-weight: 800">[نام مدرس]</span>
              <span style="font-size: 14px; color: #0B6E63; font-weight: 600">تیم آموزش آرمان محاسبات قشم</span>
              <p style="font-size: 15px; line-height: 2; color: #4A5B57">[معرفی کوتاه مدرس، سوابق کاری و تخصص]</p>
            </div>
          </div>
        </section>

        <section id="faq" style="display: flex; flex-direction: column; gap: 20px">
          <h2 style="font-size: 22px; font-weight: 800">سؤالات متداول</h2>
          <div style="display: flex; flex-direction: column; gap: 10px">
            <details open style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 16px; padding: 0 22px">
              <summary style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 15px">ویدیوها کجا پخش می‌شوند؟<svg class="fq" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></summary>
              <p style="padding: 0 0 18px; font-size: 15px; line-height: 2; color: #4A5B57">ویدیوها روی آپارات میزبانی می‌شوند و مستقیم داخل همین سایت و اپ پخش می‌شوند؛ لازم نیست به سایت دیگری بروید.</p>
            </details>
            <details style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 16px; padding: 0 22px">
              <summary style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 15px">بعد از خرید تا کی به دوره دسترسی دارم؟<svg class="fq" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></summary>
              <p style="padding: 0 0 18px; font-size: 15px; line-height: 2; color: #4A5B57">دسترسی شما دائمی است و از سایت و اپ موبایل با همان حساب می‌توانید دوره را ببینید.</p>
            </details>
            <details style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 16px; padding: 0 22px">
              <summary style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 15px">درصد پیشرفت چطور حساب می‌شود؟<svg class="fq" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E63" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></summary>
              <p style="padding: 0 0 18px; font-size: 15px; line-height: 2; color: #4A5B57">هر درسی که کامل کنید ثبت می‌شود و درصد پیشرفت دوره بر اساس درس‌های تکمیل‌شده به‌روز می‌شود.</p>
            </details>

<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: { 0: true } };
  }
  fa(n) { return String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]); }
  renderVals() {
    const data = [
      { title: 'آشنایی با مالیات بر ارزش افزوده', lessons: [
        ['معرفی دوره و نقشه راه', '۰۶:۲۰', true], ['قانون ارزش افزوده در یک نگاه', '۱۸:۴۵', true],
        ['کالاها و خدمات معاف', '۲۲:۱۰'], ['نرخ مالیات و عوارض', '۱۹:۳۰'], ['اعتبار مالیاتی و نحوه محاسبه', '۲۴:۵۰'] ] },
      { title: 'سامانه مؤدیان و صورتحساب الکترونیکی', lessons: [
        ['ثبت‌نام و ورود به سامانه مؤدیان', '۲۱:۰۵'], ['کارپوشه و شناسه یکتای حافظه مالیاتی', '۲۶:۴۰'],
        ['انواع صورتحساب الکترونیکی', '۲۳:۱۵'], ['صدور صورتحساب نوع اول و دوم', '۲۸:۳۰'],
        ['ابطال، اصلاح و برگشت از فروش', '۲۲:۵۵'], ['ارسال از طریق شرکت معتمد', '۱۷:۲۰'], ['خطاهای رایج و رفع آن‌ها', '۲۰:۱۰'] ] },
      { title: 'اظهارنامه و ثبت در دفاتر', lessons: [
        ['تهیه اظهارنامه فصلی', '۲۷:۰۰'], ['ثبت‌های حسابداری خرید و فروش', '۲۵:۳۵'], ['تطبیق دفاتر با سامانه', '۲۳:۴۰'],
        ['حساب‌های مالیات و عوارض', '۱۹:۵۰'], ['مطالبه و استرداد اعتبار', '۲۱:۱۵'], ['نمونه کامل یک فصل کاری', '۳۲:۲۰'], ['تمرین جامع با فایل اکسل', '۲۲:۰۵'] ] },
      { title: 'رسیدگی، اعتراض و جمع‌بندی', lessons: [
        ['فرایند رسیدگی و برگ تشخیص', '۲۴:۱۰'], ['اعتراض و هیئت‌های حل اختلاف', '۲۲:۴۵'], ['جرائم رایج و راه پیشگیری', '۱۹:۲۰'],
        ['چک‌لیست ماهانه حسابدار', '۱۵:۳۰'], ['جمع‌بندی و آزمون پایانی', '۱۴:۰۵'] ] }
    ];
    const open = this.state.open;
    const allOpen = data.every((_, i) => open[i]);
    let n = 0;
    const sections = data.map((s, i) => ({
      num: this.fa(i + 1),
      title: s.title,
      meta: this.fa(s.lessons.length) + ' درس',
      isOpen: !!open[i],
      expanded: open[i] ? 'true' : 'false',
      chevCls: open[i] ? 'chev rot' : 'chev',
      toggle: () => this.setState({ open: { ...this.state.open, [i]: !this.state.open[i] } }),
      lessons: s.lessons.map((l) => { n += 1; return { num: this.fa(n), title: l[0], dur: l[1], preview: !!l[2], locked: !l[2] }; })
    }));
    return {
      sections,
      allLabel: allOpen ? 'بستن همه' : 'باز کردن همه',
      toggleAll: () => {
        const next = {};
        data.forEach((_, i) => { next[i] = !allOpen; });
        this.setState({ open: next });
      }
    };
  }
}
</script>
