<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اپ — تماشای دوره | آرمان محاسبات قشم</title>
<meta name="description" content="نسخه نمایشی سایت و اپ آموزشی آکادمی آرمان محاسبات قشم">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آرمان محاسبات قشم">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
body{margin:0}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,transform .15s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96)}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.scroll>*{flex-shrink:0}
.barT{transition:width .7s cubic-bezier(.2,.7,.2,1)}
.pop{animation:pop .4s cubic-bezier(.2,.7,.2,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>
<body class="phone-page">
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="am" dir="rtl" style="width: 390px; height: 844px; background: #F6F7F6; display: flex; flex-direction: column; overflow: hidden">

  <figure style="flex: none; margin: 0; position: relative; height: 220px; background: #0C1816; display: flex; align-items: center; justify-content: center; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 28px 28px"></div>
    <a class="btn" href="app-learning.html" aria-label="بازگشت" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    <span style="position: absolute; top: 24px; left: 14px; font-size: 11px; color: rgba(255,255,255,.85); padding: 2px 8px; border: 1px solid rgba(255,255,255,.28); border-radius: 999px">پخش از آپارات</span>
    <button class="btn pulse" type="button" aria-label="پخش درس" style="position: relative; width: 64px; height: 64px; border-radius: 50%; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5v13L18 12z" fill="#0B6E63"></path></svg></button>
    <div aria-hidden="true" style="position: absolute; bottom: 0; right: 0; left: 0; padding: 10px 14px; display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.85); font-size: 11px; background: linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0))"><span>۰۰:۰۰</span><span style="flex: 1; height: 3px; border-radius: 99px; background: rgba(255,255,255,.22)"></span><span>{{ curDur }}</span></div>
  </figure>

  <div style="flex: none; background: #FFFFFF; border-bottom: 1px solid #E3E8E6; padding: 10px 16px; display: flex; align-items: center; gap: 12px">
    <div role="progressbar" aria-label="پیشرفت دوره" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pct }}" style="flex: 1; height: 6px; background: #EDF1F0; border-radius: 99px; overflow: hidden"><div class="barT" style="height: 100%; width: {{ pctCss }}; background: #0B6E63; border-radius: 99px"></div></div>
    <span style="font-size: 12px; color: #5A6B68; white-space: nowrap">{{ doneShort }}</span>
    <span style="font-size: 13px; font-weight: 800; color: #0B6E63">{{ pctLabel }}</span>
  </div>

  <main class="scroll" style="flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #0B6E63; font-weight: 600">{{ curMeta }}</span>
      <h1 style="font-size: 18px; font-weight: 800; line-height: 1.6">{{ curTitle }}</h1>
    </div>

    <div style="display: flex; gap: 8px">
      <button class="btn" type="button" onClick="{{ prev }}" aria-label="درس قبلی" style="flex: none; width: 52px; height: 50px; border-radius: 14px; border: 1px solid #DCE3E0; background: #FFFFFF; color: #10201E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      <template data-sc="if" value="{{ curDone }}" hint-placeholder-val="{{ false }}">
        <button class="btn pop" type="button" onClick="{{ toggleDone }}" aria-pressed="true" style="flex: 1; height: 50px; border-radius: 14px; border: 1px solid #0B6E63; background: #E3F1EE; color: #0B6E63; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>تکمیل شد</button>
      </template>
      <template data-sc="if" value="{{ curNotDone }}" hint-placeholder-val="{{ true }}">
        <button class="btn" type="button" onClick="{{ toggleDone }}" aria-pressed="false" style="flex: 1; height: 50px; border-radius: 14px; border: 0; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg>این درس را تمام کردم</button>
      </template>
      <button class="btn" type="button" onClick="{{ next }}" aria-label="درس بعدی" style="flex: none; width: 52px; height: 50px; border-radius: 14px; border: 1px solid #DCE3E0; background: #FFFFFF; color: #10201E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    </div>

    <template data-sc="if" value="{{ complete }}" hint-placeholder-val="{{ false }}">
      <a class="btn pop" href="app-profile.html" style="height: 50px; border-radius: 14px; background: #B4541A; color: #FFFFFF; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg>دوره کامل شد — دریافت گواهی</a>
    </template>

    <div role="tablist" aria-label="بخش‌های درس" style="display: flex; padding: 4px; background: #EBEFEE; border-radius: 14px">
      <template data-sc="for" list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button class="btn" type="button" role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="flex: 1; height: 40px; border: 0; border-radius: 11px; font: inherit; font-size: 12px; font-weight: {{ t.fw }}; background: {{ t.bg }}; color: {{ t.fg }}; box-shadow: {{ t.sh }}">{{ t.label }}</button>
      </template>
    </div>

    <template data-sc="if" value="{{ tabLessons }}" hint-placeholder-val="{{ true }}">
      <div class="fade" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 4px 6px 8px">
        <template data-sc="for" list="{{ sections }}" as="sec" hint-placeholder-count="4">
          <div style="padding: 12px 10px 4px; display: flex; justify-content: space-between; font-size: 12px"><span style="font-weight: 700; color: #33433F">{{ sec.title }}</span><span style="color: #5A6B68">{{ sec.count }}</span></div>
          <ol style="list-style: none; margin: 0; padding: 0">
            <template data-sc="for" list="{{ sec.lessons }}" as="l" hint-placeholder-count="5">
              <li>
                <button class="btn" type="button" onClick="{{ l.pick }}" aria-current="{{ l.aria }}" style="width: 100%; min-height: 54px; padding: 6px 10px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 12px; font: inherit; color: #10201E; text-align: right; background: {{ l.bg }}">
                  <template data-sc="if" value="{{ l.done }}" hint-placeholder-val="{{ true }}"><span style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: #0B6E63; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="تکمیل‌شده"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span></template>
                  <template data-sc="if" value="{{ l.todo }}" hint-placeholder-val="{{ false }}"><span style="flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #CFD8D5"></span></template>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 13px; line-height: 1.7">{{ l.title }}</span><span style="font-size: 11px; color: #5A6B68">{{ l.sub }}</span></span>
                  <template data-sc="if" value="{{ l.current }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="در حال پخش"><path d="M7 5.5v13L18 12z" fill="#0B6E63"></path></svg></template>
                </button>
              </li>
            </template>
          </ol>
        </template>
      </div>
    </template>

    <template data-sc="if" value="{{ tabFiles }}" hint-placeholder-val="{{ false }}">
      <ul class="fade" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <li style="display: flex; align-items: center; gap: 10px; padding: 12px; background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 14px"><span style="width: 40px; height: 40px; border-radius: 10px; background: #EAF0E4; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F6B2E" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 4v16"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">فایل تمرین درس.xlsx</span><span style="font-size: 11px; color: #5A6B68">۲۴۰ کیلوبایت</span></span><button class="btn" type="button" aria-label="دانلود فایل تمرین" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DCE3E0; background: #FFFFFF; color: #10201E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button></li>
        <li style="display: flex; align-items: center; gap: 10px; padding: 12px; background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 14px"><span style="width: 40px; height: 40px; border-radius: 10px; background: #F4ECE2; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A4B17" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">جزوه خلاصه درس.pdf</span><span style="font-size: 11px; color: #5A6B68">۱٫۲ مگابایت</span></span><button class="btn" type="button" aria-label="دانلود جزوه" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DCE3E0; background: #FFFFFF; color: #10201E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button></li>
      </ul>
    </template>

    <template data-sc="if" value="{{ tabNotes }}" hint-placeholder-val="{{ false }}">
      <div class="fade" style="display: flex; flex-direction: column; gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">یادداشت جدید<textarea rows="3" placeholder="نکته‌ای برای مرور بعدی…" style="border: 1px solid #DCE3E0; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px; color: #10201E; background: #FFFFFF; resize: none"></textarea></label>
        <button class="btn" type="button" style="height: 46px; border: 0; border-radius: 12px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">ذخیره</button>
        <div style="padding: 12px; background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; color: #0B6E63; font-weight: 600">دقیقه ۰۸:۱۲</span><span style="font-size: 13px; line-height: 1.9">حساب مالیات و عوارض دریافتنی و پرداختنی جدا؛ پایان فصل تهاتر.</span></div>
      </div>
    </template>

    <template data-sc="if" value="{{ tabQa }}" hint-placeholder-val="{{ false }}">
      <div class="fade" style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 8px"><label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">پرسش شما</label><input id="mq" type="text" placeholder="پرسش درباره این درس…" style="flex: 1; min-width: 0; height: 46px; border: 1px solid #DCE3E0; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 13px; color: #10201E; background: #FFFFFF"><button class="btn" type="button" style="height: 46px; padding: 0 14px; border: 0; border-radius: 12px; background: #0B6E63; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700">ارسال</button></div>
        <article style="padding: 12px; background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 14px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px"><b>علی رضایی</b> <span style="color: #5A6B68">· ۲ روز پیش</span></span><p style="font-size: 13px; line-height: 1.9">برای فروش‌های معاف هم باید همین ثبت‌ها را انجام بدهیم؟</p><div style="padding: 10px 12px; background: #F3F9F7; border-radius: 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px"><b>مدرس دوره</b> <span style="padding: 1px 6px; background: #0B6E63; color: #FFFFFF; border-radius: 999px; font-size: 10px">پاسخ مدرس</span></span><p style="font-size: 13px; line-height: 1.9">در درس ۸ همین حالت را با مثال توضیح داده‌ایم.</p></div></article>
      </div>
    </template>
  </main>
</div>
</template>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const done = {};
    for (let i = 0; i < 15; i++) done[i] = true;
    this.state = { done, cur: 15, tab: 'lessons' };
  }
  fa(n) { return String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]); }
  renderVals() {
    const data = [
      { title: 'فصل ۱ · آشنایی با ارزش افزوده', lessons: [['معرفی دوره و نقشه راه', '۰۶:۲۰'], ['قانون ارزش افزوده در یک نگاه', '۱۸:۴۵'], ['کالاها و خدمات معاف', '۲۲:۱۰'], ['نرخ مالیات و عوارض', '۱۹:۳۰'], ['اعتبار مالیاتی و نحوه محاسبه', '۲۴:۵۰']] },
      { title: 'فصل ۲ · سامانه مؤدیان', lessons: [['ثبت‌نام و ورود به سامانه مؤدیان', '۲۱:۰۵'], ['کارپوشه و شناسه یکتای حافظه مالیاتی', '۲۶:۴۰'], ['انواع صورتحساب الکترونیکی', '۲۳:۱۵'], ['صدور صورتحساب نوع اول و دوم', '۲۸:۳۰'], ['ابطال، اصلاح و برگشت از فروش', '۲۲:۵۵'], ['ارسال از طریق شرکت معتمد', '۱۷:۲۰'], ['خطاهای رایج و رفع آن‌ها', '۲۰:۱۰']] },
      { title: 'فصل ۳ · اظهارنامه و دفاتر', lessons: [['تهیه اظهارنامه فصلی', '۲۷:۰۰'], ['ثبت‌های حسابداری خرید و فروش', '۲۵:۳۵'], ['تطبیق دفاتر با سامانه', '۲۳:۴۰'], ['حساب‌های مالیات و عوارض', '۱۹:۵۰'], ['مطالبه و استرداد اعتبار', '۲۱:۱۵'], ['نمونه کامل یک فصل کاری', '۳۲:۲۰'], ['تمرین جامع با فایل اکسل', '۲۲:۰۵']] },
      { title: 'فصل ۴ · رسیدگی و جمع‌بندی', lessons: [['فرایند رسیدگی و برگ تشخیص', '۲۴:۱۰'], ['اعتراض و هیئت‌های حل اختلاف', '۲۲:۴۵'], ['جرائم رایج و راه پیشگیری', '۱۹:۲۰'], ['چک‌لیست ماهانه حسابدار', '۱۵:۳۰'], ['جمع‌بندی و آزمون پایانی', '۱۴:۰۵']] }
    ];
    const s = this.state;
    const flat = [];
    data.forEach((sec, si) => sec.lessons.forEach((l) => flat.push({ t: l[0], d: l[1], si })));
    const total = flat.length;
    const doneCount = flat.filter((_, i) => s.done[i]).length;
    const pct = Math.floor((doneCount / total) * 100);
    const cur = flat[s.cur];
    let idx = 0;
    const sections = data.map((sec) => {
      const start = idx;
      const lessons = sec.lessons.map((l) => {
        const i = idx++;
        const isCur = i === s.cur, isDone = !!s.done[i];
        return { title: l[0], sub: 'درس ' + this.fa(i + 1) + ' · ' + l[1], done: isDone, todo: !isDone, current: isCur, aria: isCur ? 'true' : 'false', bg: isCur ? '#E3F1EE' : '#FFFFFF', pick: () => this.setState({ cur: i }) };
      });
      const secDone = sec.lessons.filter((_, k) => s.done[start + k]).length;
      return { title: sec.title, count: this.fa(secDone) + '/' + this.fa(sec.lessons.length), lessons };
    });
    const tabs = [['lessons', 'درس‌ها'], ['files', 'پیوست‌ها'], ['notes', 'یادداشت'], ['qa', 'پرسش‌ها']].map(([k, label]) => ({
      label, sel: s.tab === k ? 'true' : 'false',
      bg: s.tab === k ? '#FFFFFF' : 'transparent', fg: s.tab === k ? '#10201E' : '#4A5B57',
      fw: s.tab === k ? '700' : '500', sh: s.tab === k ? '0 4px 12px -6px rgba(16,32,30,.3)' : 'none',
      pick: () => this.setState({ tab: k })
    }));
    return {
      sections, tabs,
      tabLessons: s.tab === 'lessons', tabFiles: s.tab === 'files', tabNotes: s.tab === 'notes', tabQa: s.tab === 'qa',
      pct, pctLabel: this.fa(pct) + '٪', pctCss: pct + '%',
      doneShort: this.fa(doneCount) + ' از ' + this.fa(total) + ' درس',
      complete: pct === 100,
      curTitle: cur.t, curDur: cur.d,
      curMeta: 'فصل ' + this.fa(cur.si + 1) + ' · درس ' + this.fa(s.cur + 1) + ' از ' + this.fa(total),
      curDone: !!s.done[s.cur], curNotDone: !s.done[s.cur],
      toggleDone: () => this.setState({ done: { ...this.state.done, [this.state.cur]: !this.state.done[this.state.cur] } }),
      next: () => this.setState({ cur: Math.min(total - 1, this.state.cur + 1) }),
      prev: () => this.setState({ cur: Math.max(0, this.state.cur - 1) })
    };
  }
}
