<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اپ — یادگیری من | آکادمی آرمان محاسبات</title>
<meta name="description" content="نسخه نمایشی سایت و اپ آموزشی آکادمی آرمان محاسبات قشم">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آرمان محاسبات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
body{margin:0}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,transform .15s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96)}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.scroll>*{flex-shrink:0}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bar{transform-origin:right center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .35s both}
@keyframes grow{from{transform:scaleX(0)}}
.col{transform-origin:bottom center;animation:colg .9s cubic-bezier(.2,.7,.2,1) .3s both}
@keyframes colg{from{transform:scaleY(0)}}
.ring{animation:ring 1.5s cubic-bezier(.2,.7,.2,1) .4s both}
@keyframes ring{from{stroke-dashoffset:100}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>
<body class="phone-page">
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="am" dir="rtl" style="width: 390px; height: 844px; background: #F6F7F6; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex: none; padding: 20px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="font-size: 22px; font-weight: 800">یادگیری من</h1>
    <span style="font-size: 12px; color: #5A6B68">شنبه ۱۸ مهر</span>
  </header>

  <main class="scroll" style="flex: 1; overflow-y: auto; padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div class="rise" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 800">۳</span><span style="font-size: 11px; color: #5A6B68">دوره فعال</span></div>
      <div class="rise d1" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 800">۶۳</span><span style="font-size: 11px; color: #5A6B68">درس تکمیل‌شده</span></div>
      <div class="rise d2" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 800">۲۴<span style="font-size: 11px; font-weight: 500; color: #5A6B68"> ساعت</span></span><span style="font-size: 11px; color: #5A6B68">زمان یادگیری</span></div>
    </div>

    <a href="app-player.html" class="btn rise d1" style="position: relative; overflow: hidden; background: #10201E; color: #FFFFFF; border-radius: 22px; padding: 18px; display: flex; align-items: center; gap: 16px">
      <div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 24px 24px"></div>
      <svg style="position: relative; flex: none" width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="۶۲ درصد"><circle cx="40" cy="40" r="33" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="7"></circle><circle class="ring" cx="40" cy="40" r="33" fill="none" stroke="#F2B98A" stroke-width="7" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="38" transform="rotate(-90 40 40)"></circle><text x="40" y="46" text-anchor="middle" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="17" font-weight="800">۶۲٪</text></svg>
      <span style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; color: #C3D2CF">ادامه یادگیری</span>
        <span style="font-size: 14px; font-weight: 800; line-height: 1.6">مالیات بر ارزش افزوده و سامانه مؤدیان</span>
        <span style="font-size: 11px; color: #C3D2CF">درس ۱۶ · حساب‌های مالیات و عوارض</span>
      </span>
    </a>

    <div role="tablist" aria-label="فیلتر دوره‌ها" style="display: flex; padding: 4px; background: #EBEFEE; border-radius: 14px">
      <template data-sc="for" list="{{ filters }}" as="f" hint-placeholder-count="3">
        <button class="btn" type="button" role="tab" aria-selected="{{ f.sel }}" onClick="{{ f.pick }}" style="flex: 1; height: 40px; border: 0; border-radius: 11px; font: inherit; font-size: 12px; font-weight: {{ f.fw }}; background: {{ f.bg }}; color: {{ f.fg }}; box-shadow: {{ f.sh }}">{{ f.label }}</button>
      </template>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <template data-sc="for" list="{{ courses }}" as="c" hint-placeholder-count="3">
        <a href="{{ c.href }}" class="btn fade" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; color: #10201E">
          <span style="display: flex; gap: 12px; align-items: center">
            <span style="flex: none; width: 48px; height: 48px; border-radius: 12px; background: {{ c.tint }}"></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700; line-height: 1.6">{{ c.title }}</span><span style="font-size: 11px; color: #5A6B68">{{ c.sub }}</span></span>
            <span style="font-size: 14px; font-weight: 800; color: {{ c.color }}">{{ c.pctLabel }}</span>
          </span>
          <span style="display: block; height: 6px; background: #EDF1F0; border-radius: 99px; overflow: hidden"><span class="bar" style="display: block; height: 100%; width: {{ c.pctCss }}; background: {{ c.color }}; border-radius: 99px"></span></span>
        </a>
      </template>
    </div>

    <section class="rise d3" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="font-size: 14px; font-weight: 800">فعالیت این هفته</h2><span style="font-size: 11px; color: #5A6B68">۳ ساعت و ۴۰ دقیقه</span></div>
      <div role="img" aria-label="نمودار دقیقه‌های یادگیری در ۷ روز اخیر" style="height: 90px; display: flex; align-items: flex-end; gap: 10px">
        <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; height: 35%; background: #CFE3DF; border-radius: 6px"></span><span style="font-size: 10px; color: #5A6B68">ش</span></span>
        <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; height: 60%; background: #CFE3DF; border-radius: 6px; animation-delay: .36s"></span><span style="font-size: 10px; color: #5A6B68">ی</span></span>
        <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; height: 20%; background: #CFE3DF; border-radius: 6px; animation-delay: .42s"></span><span style="font-size: 10px; color: #5A6B68">د</span></span>
        <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; height: 78%; background: #CFE3DF; border-radius: 6px; animation-delay: .48s"></span><span style="font-size: 10px; color: #5A6B68">س</span></span>
        <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; height: 48%; background: #CFE3DF; border-radius: 6px; animation-delay: .54s"></span><span style="font-size: 10px; color: #5A6B68">چ</span></span>
        <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; height: 8%; background: #CFE3DF; border-radius: 6px; animation-delay: .6s"></span><span style="font-size: 10px; color: #5A6B68">پ</span></span>
        <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; height: 92%; background: #0B6E63; border-radius: 6px; animation-delay: .66s"></span><span style="font-size: 10px; color: #10201E; font-weight: 700">ج</span></span>
      </div>
    </section>
  </main>

  <nav aria-label="منوی اپ" style="flex: none; background: #FFFFFF; border-top: 1px solid #E3E8E6; padding: 8px 16px 18px; display: flex; justify-content: space-around">
    <a href="app-home.html" style="min-width: 72px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5A6B68; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>خانه</a>
    <a href="app-learning.html" aria-current="page" style="min-width: 72px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #0B6E63; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>یادگیری من</a>
    <a href="app-profile.html" style="min-width: 72px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5A6B68; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>پروفایل</a>
  </nav>
</div>
</template>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'all' };
  }
  renderVals() {
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const all = [
      { title: 'مالیات بر ارزش افزوده و سامانه مؤدیان', pct: 62, sub: '۱۵ از ۲۴ درس · امروز', tint: '#E7ECF2', href: 'app-player.html' },
      { title: 'اصول حسابداری ۱ و ۲', pct: 28, sub: '۱۲ از ۴۲ درس · ۳ روز پیش', tint: '#E3F1EE', href: 'app-player.html' },
      { title: 'اکسل کاربردی برای حسابداران', pct: 100, sub: 'تکمیل‌شده · گواهی آماده است', tint: '#EAF0E4', href: 'app-profile.html' }
    ].map((c) => ({ ...c, pctLabel: fa(c.pct) + '٪', pctCss: c.pct + '%', color: c.pct === 100 ? '#B4541A' : '#0B6E63' }));
    const f = this.state.f;
    const filters = [['all', 'همه'], ['doing', 'در حال یادگیری'], ['done', 'تکمیل‌شده']].map(([k, label]) => ({
      label, sel: f === k ? 'true' : 'false',
      bg: f === k ? '#FFFFFF' : 'transparent', fg: f === k ? '#10201E' : '#4A5B57',
      fw: f === k ? '700' : '500', sh: f === k ? '0 4px 12px -6px rgba(16,32,30,.3)' : 'none',
      pick: () => this.setState({ f: k })
    }));
    const courses = f === 'all' ? all : f === 'done' ? all.filter((c) => c.pct === 100) : all.filter((c) => c.pct < 100);
    return { filters, courses };
  }
}
</script>
<script src="assets/dc-lite.js" defer></script>
<noscript><p style="font-family:Tahoma,sans-serif;padding:24px;direction:rtl">برای دیدن این نسخه نمایشی، جاوااسکریپت مرورگر را روشن کنید.</p></noscript>
</body>
</html>
