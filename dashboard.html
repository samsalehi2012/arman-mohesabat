<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل دانشجو | آکادمی آرمان محاسبات</title>
<meta name="description" content="نسخه نمایشی سایت و اپ آموزشی آکادمی آرمان محاسبات قشم">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B6E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آرمان محاسبات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/proto.css">
<style>
body{margin:0;background:#F6F7F6}
a{color:#0B6E63;text-decoration:none}a:hover{color:#08564D}
.am{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:#10201E;direction:rtl}
.am *{box-sizing:border-box}
.am h1,.am h2,.am h3,.am p{margin:0}
.btn{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .15s ease;cursor:pointer}
.btn:active{transform:scale(.97)}
.bp:hover{background:#08564D !important;color:#FFFFFF !important}
.bg:hover{background:#EDF1F0 !important}
.bw:hover{background:#F2B98A !important;color:#10201E !important}
.nv{transition:background-color .2s ease,color .2s ease}.nv:hover{background:#EDF1F0 !important}
.lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s ease}
.lift:hover{transform:translateY(-3px);box-shadow:0 20px 40px -30px rgba(16,32,30,.5)}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bar{transform-origin:right center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .35s both}
@keyframes grow{from{transform:scaleX(0)}}
.col{transform-origin:bottom center;animation:colg .9s cubic-bezier(.2,.7,.2,1) .3s both}
@keyframes colg{from{transform:scaleY(0)}}
.ring{animation:ring 1.5s cubic-bezier(.2,.7,.2,1) .4s both}
@keyframes ring{from{stroke-dashoffset:100}}
.pop{animation:pop .4s cubic-bezier(.2,.7,.2,1.15) both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.inp{transition:border-color .2s ease,box-shadow .2s ease}.inp:focus{border-color:#0B6E63 !important;box-shadow:0 0 0 4px rgba(11,110,99,.12);outline:0}
.am :focus-visible{outline:2px solid #0B6E63;outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){.am *{animation:none !important;transition:none !important}}
</style>
</head>
<body class="web-page">
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="am" dir="rtl" style="background: #F6F7F6; min-height: 100vh">
  <div style="max-width: 1360px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 28px) 48px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

    <!-- Side menu -->
    <aside style="flex: 1 1 250px; max-width: 100%; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 18px">
        <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: #10201E; padding: 0 4px">
          <svg width="34" height="34" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="11" fill="#0B6E63"></rect><path d="M11 26h16M11 19.5h10.5M11 13h6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path><circle cx="26.5" cy="13" r="2.8" fill="#F2B98A"></circle></svg>
          <span style="font-weight: 800; font-size: 15px">آرمان محاسبات</span>
        </a>
        <nav aria-label="پنل دانشجو" style="display: flex; flex-direction: column; gap: 4px">
          <button class="btn nv" type="button" onClick="{{ go.home }}" style="height: 46px; padding: 0 14px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; font: inherit; font-size: 14px; text-align: right; background: {{ nav.home.bg }}; color: {{ nav.home.fg }}; font-weight: {{ nav.home.fw }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>پیشخوان</button>
          <button class="btn nv" type="button" onClick="{{ go.courses }}" style="height: 46px; padding: 0 14px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; font: inherit; font-size: 14px; text-align: right; background: {{ nav.courses.bg }}; color: {{ nav.courses.fg }}; font-weight: {{ nav.courses.fw }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5.5v13L18 12z"></path></svg>دوره‌های من</button>
          <button class="btn nv" type="button" onClick="{{ go.certs }}" style="height: 46px; padding: 0 14px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; font: inherit; font-size: 14px; text-align: right; background: {{ nav.certs.bg }}; color: {{ nav.certs.fg }}; font-weight: {{ nav.certs.fw }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg>گواهی‌ها</button>
          <button class="btn nv" type="button" onClick="{{ go.pay }}" style="height: 46px; padding: 0 14px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; font: inherit; font-size: 14px; text-align: right; background: {{ nav.pay.bg }}; color: {{ nav.pay.fg }}; font-weight: {{ nav.pay.fw }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg>پرداخت‌ها</button>
          <button class="btn nv" type="button" onClick="{{ go.qa }}" style="height: 46px; padding: 0 14px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; font: inherit; font-size: 14px; text-align: right; background: {{ nav.qa.bg }}; color: {{ nav.qa.fg }}; font-weight: {{ nav.qa.fw }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span style="flex: 1">پرسش‌های من</span><span style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: #B4541A; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center" aria-label="۱ پاسخ جدید">۱</span></button>
          <button class="btn nv" type="button" onClick="{{ go.profile }}" style="height: 46px; padding: 0 14px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; font: inherit; font-size: 14px; text-align: right; background: {{ nav.profile.bg }}; color: {{ nav.profile.fg }}; font-weight: {{ nav.profile.fw }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>پروفایل</button>
          <button class="btn nv" type="button" onClick="{{ go.support }}" style="height: 46px; padding: 0 14px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; font: inherit; font-size: 14px; text-align: right; background: {{ nav.support.bg }}; color: {{ nav.support.fg }}; font-weight: {{ nav.support.fw }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0v4a2 2 0 0 1-2 2h-1v-6h3M4 13v4a2 2 0 0 0 2 2h1v-6H4"></path></svg>پشتیبانی</button>
          <a class="btn nv" href="index.html" style="height: 46px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; color: #9A4515; margin-top: 8px; border-top: 1px solid #E3E8E6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>خروج</a>
        </nav>
      </div>
      <div style="background: #10201E; color: #FFFFFF; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2B98A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"></rect><path d="M12 7v6M9.5 10.5L12 13l2.5-2.5"></path></svg>
        <span style="font-weight: 700; font-size: 15px">روی گوشی هم ادامه دهید</span>
        <span style="font-size: 13px; line-height: 1.9; color: #C3D2CF">اپ آکادمی را به صفحه اصلی اضافه کنید؛ پیشرفتتان یکی است.</span>
        <a class="btn bw" href="app-home.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); color: #FFFFFF; font-weight: 600; font-size: 14px">نصب اپلیکیشن</a>
      </div>
    </aside>

    <!-- Content -->
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="font-size: 26px; font-weight: 800">{{ heading }}</h1>
          <span style="font-size: 14px; color: #5A6B68">شنبه ۱۸ مهر ۱۴۰۵</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <a class="btn bg" href="index.html#courses" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #DCE3E0; background: #FFFFFF; color: #10201E; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>دوره‌های جدید</a>
          <button class="btn bg" type="button" aria-label="اعلان‌ها — ۲ مورد جدید" style="position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DCE3E0; background: #FFFFFF; color: #10201E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg><span style="position: absolute; top: 9px; left: 10px; width: 8px; height: 8px; border-radius: 50%; background: #B4541A; border: 2px solid #FFFFFF"></span></button>
          <span style="width: 44px; height: 44px; border-radius: 12px; background: #E3F1EE; color: #0B6E63; font-weight: 800; display: flex; align-items: center; justify-content: center">س م</span>
        </div>
      </div>

      <!-- HOME -->
      <template data-sc="if" value="{{ v.home }}" hint-placeholder-val="{{ true }}">
        <div class="fade" style="display: flex; flex-direction: column; gap: 22px">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 14px">
            <div class="rise" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5A6B68">دوره‌های فعال</span><span style="font-size: 28px; font-weight: 800">۳</span></div>
            <div class="rise d1" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5A6B68">درس‌های تکمیل‌شده</span><span style="font-size: 28px; font-weight: 800">۶۳</span></div>
            <div class="rise d2" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5A6B68">زمان یادگیری</span><span style="font-size: 28px; font-weight: 800">۲۴ <span style="font-size: 14px; font-weight: 500; color: #5A6B68">ساعت</span></span></div>
            <div class="rise d3" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #5A6B68">گواهی‌ها</span><span style="font-size: 28px; font-weight: 800; color: #B4541A">۱</span></div>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
            <div style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
              <section class="rise d1" style="background: #10201E; color: #FFFFFF; border-radius: 24px; padding: 26px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px; position: relative; overflow: hidden">
                <div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 32px 32px"></div>
                <svg style="position: relative; flex: none" width="108" height="108" viewBox="0 0 108 108" role="img" aria-label="۶۲ درصد"><circle cx="54" cy="54" r="45" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="9"></circle><circle class="ring" cx="54" cy="54" r="45" fill="none" stroke="#F2B98A" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="38" transform="rotate(-90 54 54)"></circle><text x="54" y="62" text-anchor="middle" fill="#FFFFFF" font-family="Vazirmatn, Tahoma, sans-serif" font-size="24" font-weight="800">۶۲٪</text></svg>
                <div style="position: relative; flex: 1 1 240px; display: flex; flex-direction: column; gap: 8px">
                  <span style="font-size: 13px; color: #C3D2CF">ادامه یادگیری</span>
                  <h2 style="font-size: 20px; font-weight: 800; line-height: 1.6">مالیات بر ارزش افزوده و سامانه مؤدیان</h2>
                  <span style="font-size: 14px; color: #C3D2CF">درس بعدی: ۱۶ · حساب‌های مالیات و عوارض</span>
                </div>
                <a class="btn bw" href="player.html" style="position: relative; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px; background: #FFFFFF; color: #10201E; border-radius: 14px; font-weight: 700; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5v13L18 12z" fill="currentColor"></path></svg>ادامه از همین درس</a>
              </section>

              <section style="display: flex; flex-direction: column; gap: 14px">
                <div style="display: flex; justify-content: space-between; align-items: center"><h2 style="font-size: 18px; font-weight: 800">دوره‌های من</h2><button class="btn" type="button" onClick="{{ go.courses }}" style="border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #0B6E63; min-height: 44px">همه</button></div>
                <template data-sc="for" list="{{ courses }}" as="c" hint-placeholder-count="3">
                  <div class="lift" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 18px; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
                    <span style="flex: none; width: 56px; height: 56px; border-radius: 14px; background: {{ c.tint }}"></span>
                    <div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
                      <div style="display: flex; justify-content: space-between; gap: 12px"><span style="font-weight: 700; font-size: 15px">{{ c.title }}</span><span style="font-weight: 800; font-size: 15px; color: {{ c.color }}">{{ c.pctLabel }}</span></div>
                      <div style="height: 7px; background: #EDF1F0; border-radius: 99px; overflow: hidden"><div class="bar" style="height: 100%; width: {{ c.pctCss }}; background: {{ c.color }}; border-radius: 99px"></div></div>
                      <span style="font-size: 13px; color: #5A6B68">{{ c.sub }}</span>
                    </div>
                    <a class="btn bg" href="{{ c.href }}" style="flex: none; display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border: 1px solid #DCE3E0; background: #FFFFFF; border-radius: 12px; color: #10201E; font-size: 14px; font-weight: 600">{{ c.cta }}</a>
                  </div>
                </template>
              </section>
            </div>

            <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
              <section class="rise d2" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
                <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="font-size: 16px; font-weight: 800">فعالیت این هفته</h2><span style="font-size: 13px; color: #5A6B68">۳ ساعت و ۴۰ دقیقه</span></div>
                <div role="img" aria-label="نمودار دقیقه‌های یادگیری در ۷ روز اخیر" style="height: 120px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px">
                  <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; max-width: 26px; height: 35%; background: #CFE3DF; border-radius: 8px"></span><span style="font-size: 12px; color: #5A6B68">ش</span></span>
                  <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; max-width: 26px; height: 60%; background: #CFE3DF; border-radius: 8px; animation-delay: .36s"></span><span style="font-size: 12px; color: #5A6B68">ی</span></span>
                  <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; max-width: 26px; height: 20%; background: #CFE3DF; border-radius: 8px; animation-delay: .42s"></span><span style="font-size: 12px; color: #5A6B68">د</span></span>
                  <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; max-width: 26px; height: 78%; background: #CFE3DF; border-radius: 8px; animation-delay: .48s"></span><span style="font-size: 12px; color: #5A6B68">س</span></span>
                  <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; max-width: 26px; height: 48%; background: #CFE3DF; border-radius: 8px; animation-delay: .54s"></span><span style="font-size: 12px; color: #5A6B68">چ</span></span>
                  <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; max-width: 26px; height: 8%; background: #CFE3DF; border-radius: 8px; animation-delay: .6s"></span><span style="font-size: 12px; color: #5A6B68">پ</span></span>
                  <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end"><span class="col" style="width: 100%; max-width: 26px; height: 92%; background: #0B6E63; border-radius: 8px; animation-delay: .66s"></span><span style="font-size: 12px; color: #10201E; font-weight: 700">ج</span></span>
                </div>
              </section>

              <section class="rise d3" style="background: #FFFFFF; border: 1px solid #E3E8E6; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
                <h2 style="font-size: 16px; font-weight: 800">آخرین گواهی</h2>
                <div style="border: 1px solid #EAD9C8; background: #FDF8F3; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
                  <span style="display: flex; align-items: center; gap: 8px; color: #9A4515; font-size: 13px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14L7 22l5-3 5 3-1.5-8"></path></svg>گواهی پایان دوره</span>
                  <span style="font-weight: 700; font-size: 15px">اکسل کاربردی برای حسابداران</span>

      b: { no: 'AMQ-INV-1405-0327', course: 'اصول حسابداری ۱ و ۲', date: '۲ شهریور ۱۴۰۵', price: '۱٬۴۵۰٬۰۰۰', disc: '۰', total: '۱٬۴۵۰٬۰۰۰', ref: '۷۷۹۰۵۱' },

    };
    const inv = { a: () => this.setState({ inv: 'a' }), b: () => this.setState({ inv: 'b' }), c: () => this.setState({ inv: 'c' }) };
    const nav = {}, go = {}, v = {};
    keys.forEach((k) => {
      const on = view === k;
      nav[k] = { bg: on ? '#E3F1EE' : 'transparent', fg: on ? '#0B6E63' : '#33433F', fw: on ? '700' : '500' };
      go[k] = () => this.setState({ view: k, supportSent: false });
      v[k] = on;
    });
    const courses = [
      { title: 'مالیات بر ارزش افزوده و سامانه مؤدیان', pct: 62, sub: '۱۵ از ۲۴ درس · آخرین بازدید امروز', tint: '#E7ECF2', href: 'player.html', cta: 'ادامه' },

      supportSent: this.state.supportSent,
      sendSupport: () => this.setState({ supportSent: true })

}
</script>
